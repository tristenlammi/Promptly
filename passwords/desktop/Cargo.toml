# The Windows desktop app. See README.md.
[workspace]
resolver = "2"
members = ["crypto-tests", "native", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
