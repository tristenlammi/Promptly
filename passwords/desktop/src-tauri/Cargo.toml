[package]
name = "promptly-passwords"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "promptly-passwords"

[[bin]]
name = "promptly-passwords"
path = "src/main.rs"

# Started by the browser for the extension's Windows Hello. Small, with no webview in it.
[[bin]]
name = "promptly-native-host"
path = "src/bin/promptly-native-host.rs"

[features]
# Test builds only: an in-memory clipboard, a Hello that does as it's told, a data folder
# from the environment, and a way to open the overlay without a real key press. A release
# build has none of it. See README.md.
e2e = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
promptly-native = { path = "../native" }
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "zip"] }
tokio = { version = "=1.48.0", features = ["sync", "time"] }
zeroize = "=1.8.2"
