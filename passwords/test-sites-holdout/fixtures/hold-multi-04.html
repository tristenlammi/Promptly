<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alder & Finch Accountants</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Georgia, "Times New Roman", serif;color:#2b2622;background:#f6f1e8}
a{color:#a4502a}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#3d3128;color:#f6f1e8}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #d9cfc0;border-radius:4px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #d9cfc0;border-radius:4px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #d9cfc0;border-radius:4px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:4px;background:#a4502a;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#a4502a;border:1px solid #a4502a}
.foot{margin-top:48px;padding:24px;border-top:1px solid #d9cfc0;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
.track{overflow:hidden}.rail{display:flex;width:200%;transition:transform .25s ease}.rail.on{transform:translateX(-50%)}.pane{width:50%;padding:2px}.pane.off{visibility:hidden}
</style>
</head>
<body>
<header class="top"><strong>Alder &amp; Finch</strong><nav><a href="#">Services</a><a href="#">Team</a><a href="#">Tax dates</a></nav></header>
<main><div class="card"><div class="track"><div class="rail" id="rail">
<section class="pane" id="p1"><h1>Who's signing in today?</h1><p class="lead">Use the address on your engagement letter.</p><input type="email" class="fld" aria-label="Client address" name="ca"><button id="fwd" type="button">Next</button></section>
<section class="pane off" id="p2"><h1>Prove it's you</h1><p class="lead">The one you set for the client area.</p><input type="password" class="fld" aria-label="Client area secret" name="cs"><button type="button">Open my files</button></section>
</div></div></div></main><footer class="foot"><div><strong>Alder &amp; Finch</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div><p style="margin:0 0 6px">Tax deadline reminders</p><form action="#" onsubmit="return false"><input id="taxn" name="e" type="email" placeholder="you@business.example"><button type="button">Remind me</button></form></div><div class="muted">&copy; 2026 Alder &amp; Finch</div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r("#p1 input",[]),"password":r("#p2 input",[])};}};</script>
<script>
document.querySelector('#fwd').addEventListener('click',function(){var p2=document.querySelector('#p2');p2.classList.remove('off');document.querySelector('#rail').classList.add('on');setTimeout(function(){document.querySelector('#p1').classList.add('off');p2.setAttribute('data-settled','1');},320);});
</script>
</body>
</html>
