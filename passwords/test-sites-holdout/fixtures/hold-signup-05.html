<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanta Row | Invitation</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Tahoma, sans-serif;color:#e8e6e3;background:#1b1d22}
a{color:#e0a23a}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#111317;color:#e8e6e3}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #3b3f47;border-radius:8px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#26292f;border:1px solid #3b3f47;border-radius:8px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #3b3f47;border-radius:8px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:8px;background:#e0a23a;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#e0a23a;border:1px solid #e0a23a}
.foot{margin-top:48px;padding:24px;border-top:1px solid #3b3f47;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
.bar{height:6px;background:#3b3f47;border-radius:4px;margin:-8px 0 14px}.bar i{display:block;height:6px;width:0;background:#e0a23a;border-radius:4px}
</style>
</head>
<body>
<header class="top"><strong>Vanta Row</strong><nav><a href="#">Members</a><a href="#">Journal</a></nav></header>
<main><div class="card"><h1>You've been invited</h1><p class="lead">Finish setting up your membership.</p><form action="#" onsubmit="return false">
<label class="fld"><span>Invitation code</span><input id="inv" name="inv" type="text" value="INV-8821"></label>
<label class="fld"><span>Email you'll log in with</span><input id="lg" name="lg" type="email"></label>
<label class="fld"><span>New password</span><input id="np" name="np" type="password"></label><div class="bar"><i id="str"></i></div>
<label class="fld"><span>New password again</span><input id="np2" name="np2" type="password"></label>
<div style="position:absolute;left:-7000px" aria-hidden="true"><label>Company website<input id="trap-url" name="url" tabindex="-1" type="text"></label></div>
<button type="submit">Accept invitation</button></form></div></main><footer class="foot"><div><strong>Vanta Row</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Vanta Row</div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r("#lg",[]),"new-password":r("#np",[]),"confirm-password":r("#np2",[])};}};</script>
<script>
var np=document.querySelector('#np');np.addEventListener('input',function(){document.querySelector('#str').style.width=Math.min(100,np.value.length*8)+'%';});
</script>
</body>
</html>
