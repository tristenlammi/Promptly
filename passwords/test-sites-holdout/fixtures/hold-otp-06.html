<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridel Cloud</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Trebuchet MS", sans-serif;color:#33202a;background:#fff6f7}
a{color:#b0305f}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#7c2748;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #edcfd8;border-radius:20px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #edcfd8;border-radius:20px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #edcfd8;border-radius:20px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:20px;background:#b0305f;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#b0305f;border:1px solid #b0305f}
.foot{margin-top:48px;padding:24px;border-top:1px solid #edcfd8;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
.sep{font-size:1.4em;opacity:.6}
</style>
</head>
<body>
<header class="top"><strong>Meridel Cloud</strong><nav><a href="#">Docs</a><a href="#">Status</a><a href="#">Pricing</a></nav></header>
<main><div class="card"><h1>Sign-in token</h1><p class="lead">Read the token off the Meridel Verify app.</p>
<form action="#" onsubmit="return false"><div class="boxes" id="tk"><input data-p="1" maxlength="1" inputmode="numeric" type="text" aria-label="Character 1"><input data-p="2" maxlength="1" inputmode="numeric" type="text" aria-label="Character 2"><input data-p="3" maxlength="1" inputmode="numeric" type="text" aria-label="Character 3"><span class="sep">-</span><input data-p="4" maxlength="1" inputmode="numeric" type="text" aria-label="Character 4"><input data-p="5" maxlength="1" inputmode="numeric" type="text" aria-label="Character 5"><input data-p="6" maxlength="1" inputmode="numeric" type="text" aria-label="Character 6"></div><button type="submit">Continue</button></form>
<hr style="margin:20px 0;border:0;border-top:1px solid #edcfd8"><p class="muted">No app? Send a token by text instead.</p><form action="#" onsubmit="return false" style="display:flex;gap:8px"><input id="alt-number" name="alt" type="tel" placeholder="Phone number"><button class="ghost" type="button">Send</button></form></div></main><footer class="foot"><div><strong>Meridel Cloud</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Meridel Cloud</div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"otp":[r("#tk input[data-p=\"1\"]",[]),r("#tk input[data-p=\"2\"]",[]),r("#tk input[data-p=\"3\"]",[]),r("#tk input[data-p=\"4\"]",[]),r("#tk input[data-p=\"5\"]",[]),r("#tk input[data-p=\"6\"]",[])].join('')};}};</script>
<script>
var bx=[].slice.call(document.querySelectorAll("#tk input"));
bx.forEach(function(b,i){
  b.addEventListener('input',function(){b.value=b.value.replace(/[^0-9]/g,'').slice(0,1);if(b.value&&bx[i+1])bx[i+1].focus();});
  b.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!b.value&&bx[i-1])bx[i-1].focus();});
  b.addEventListener('paste',function(e){var t=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'');if(!t)return;e.preventDefault();bx.forEach(function(x,j){x.value=t[j]||'';});});
});
</script>
</body>
</html>
