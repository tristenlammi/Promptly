<title>Fieldnote | Recovery</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui, sans-serif;color:#1d1b26;background:#fbfaff}
a{color:#5b3fd6}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#fff;color:#1d1b26}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #e2def2;border-radius:12px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e2def2;border-radius:12px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #e2def2;border-radius:12px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:12px;background:#5b3fd6;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#5b3fd6;border:1px solid #5b3fd6}
.foot{margin-top:48px;padding:24px;border-top:1px solid #e2def2;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}

</style>
</head>

<header class="top"><strong>Fieldnote</strong><nav><a href="#">Pricing</a><a href="#">Blog</a></nav></header>
<main><div class="card"><h1>Pick something new</h1><p class="lead">Recovery link verified for t&#8226;&#8226;&#8226;@fieldnote.example.</p><form action="#" onsubmit="return false">
<label class="fld"><span>Something you've never used before</span><input name="v1" type="password"></label>
<label class="fld"><span>And one more time</span><input name="v2" type="password"></label>
<button type="submit">Save and continue</button></form></div></main><footer class="foot"><div><strong>Fieldnote</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div><p style="margin:0 0 6px">Field reports by email</p><form action="#" onsubmit="return false"><input id="fn-up" name="e" type="email" placeholder="you@research.example"><button type="button">Send them</button></form></div><div class="muted">&copy; 2026 Fieldnote</div></footer>

</html>
