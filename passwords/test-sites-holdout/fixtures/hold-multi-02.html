<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline Mobile | My Ridgeline</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI", Arial, sans-serif;color:#17212b;background:#eef2f6}
a{color:#0f6cbd}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#10324f;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #c6d1dc;border-radius:2px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #c6d1dc;border-radius:2px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c6d1dc;border-radius:2px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:2px;background:#0f6cbd;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#0f6cbd;border:1px solid #0f6cbd}
.foot{margin-top:48px;padding:24px;border-top:1px solid #c6d1dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}

</style>
</head>
<body>
<header class="top"><strong>Ridgeline Mobile</strong><nav><a href="#">Plans</a><a href="#">Phones</a><a href="#">Coverage map</a></nav><input id="cov" placeholder="Check coverage: postcode"></header>
<main><div class="card"><h1>My Ridgeline</h1><form action="#" onsubmit="return false"><div id="slot">
<label class="fld"><span>Mobile number or email address</span><input name="principal" type="text"></label>
<button id="nx" type="button">Next</button></div></form></div></main><footer class="foot"><div><strong>Ridgeline Mobile</strong><ul><li><a href="#">Store finder</a></li><li><a href="#">Network status</a></li></ul></div><div class="muted">&copy; 2026 Ridgeline Mobile</div></footer>
<script>window.__fixture={state:function(){return {username:window.__m.who,password:window.__m.pw};}};</script>
<script>
window.__m={who:'',pw:''};
var slot=document.querySelector('#slot');
slot.addEventListener('input',function(e){if(e.target.name==='principal')window.__m.who=e.target.value;if(e.target.name==='secret_v2')window.__m.pw=e.target.value;});
document.querySelector('#nx').addEventListener('click',function(){var w=document.createElement('input');w.type='hidden';w.name='principal';w.value=window.__m.who;
slot.innerHTML='<p class="lead">Now your password</p><input name="secret_v2" type="password" class="fld" aria-label="Password"><button type="submit">Sign in</button> <a href="#">Text me a link</a>';slot.appendChild(w);});
</script>
</body>
</html>
