<style>

body{margin:0;font:15px/1.55 "Trebuchet MS", sans-serif;color:#33202a;background:#fff6f7}
a{color:#b0305f}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#7c2748;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #edcfd8;border-radius:20px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #edcfd8;border-radius:20px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #edcfd8;border-radius:20px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:20px;background:#b0305f;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#b0305f;border:1px solid #b0305f}
.foot{margin-top:48px;padding:24px;border-top:1px solid #edcfd8;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}

</style>
</head>

<header class="top"><strong>Thistle &amp; Thread</strong><nav><a href="#">Wool</a><a href="#">Patterns</a></nav></header>
<main><div class="card"><h1>Where's this going?</h1><form action="#" onsubmit="return false">
<label class="fld"><span>Deliver to</span><input id="d1" type="text"></label>
<label class="fld"><span>Organisation (if any)</span><input id="d2" type="text"></label>
<label class="fld"><span>House number and street</span><input id="d3" type="text"></label>
<label class="fld"><span>Flat, suite, etc.</span><input id="d4" type="text"></label>
<label class="fld"><span>Town</span><input id="d5" type="text"></label>
<label class="fld"><span>County or province</span><input id="d6" type="text"></label>
<label class="fld"><span>Post code</span><input id="d7" type="text"></label>
<label class="fld"><span>Country</span><select id="d8"><option value="">Choose</option><option value="GB">United Kingdom</option><option value="IE">Ireland</option><option value="NL">Netherlands</option></select></label>
<label class="fld"><span>Number for the courier</span><input id="d9" type="tel"></label>
<label class="fld"><span>Gift message</span><textarea id="gift-msg" rows="2"></textarea></label>
<button type="submit">Continue to payment</button></form></div></main><footer class="foot"><div><strong>Thistle &amp; Thread</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Thistle &amp; Thread</div></footer>
