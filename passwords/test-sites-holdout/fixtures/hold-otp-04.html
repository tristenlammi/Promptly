<!doctype html>

<title>Ironbark Payroll</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Verdana, sans-serif;color:#1f2d24;background:#edf4ee}
a{color:#1f7a4d}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#1f5138;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #c5d8ca;border-radius:6px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #c5d8ca;border-radius:6px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c5d8ca;border-radius:6px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:6px;background:#1f7a4d;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#1f7a4d;border:1px solid #1f7a4d}
.foot{margin-top:48px;padding:24px;border-top:1px solid #c5d8ca;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
fieldset{border:1px solid #c5d8ca;border-radius:6px;padding:16px}legend{font-weight:700;padding:0 6px}
</style>
</head>
<body>
<header class="top"><strong>Ironbark Payroll</strong><nav><a href="#">Payslips</a><a href="#">Leave</a><a href="#">Directory</a></nav><input id="dir-q" placeholder="Search colleagues"></header>
<main><div class="card"><h1>Before you see your payslip</h1>
<form action="#" onsubmit="return false"><fieldset id="sec"><legend>Numbers from your authenticator</legend><div class="boxes" style="margin:0"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 1 of 6"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 2 of 6"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 3 of 6"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 4 of 6"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 5 of 6"><input name="v[]" maxlength="1" inputmode="numeric" type="text" aria-label="Digit 6 of 6"></div></fieldset><p><button type="submit">Check</button></p></form></div></main><footer class="foot"><div><strong>Ironbark Payroll</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Ironbark Payroll</div></footer>

<script>

</html>
