<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marigold CRM | Settings</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI", Arial, sans-serif;color:#17212b;background:#eef2f6}
a{color:#0f6cbd}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#10324f;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #c6d1dc;border-radius:2px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #c6d1dc;border-radius:2px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c6d1dc;border-radius:2px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:2px;background:#0f6cbd;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#0f6cbd;border:1px solid #0f6cbd}
.foot{margin-top:48px;padding:24px;border-top:1px solid #c6d1dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
.sect{margin-bottom:24px}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
</style>
</head>
<body>
<header class="top"><strong>Marigold CRM</strong><nav><a href="#">Contacts</a><a href="#">Deals</a><a href="#">Reports</a></nav><input id="cq" placeholder="Search contacts"></header>
<main><section class="card wide sect"><h2>Profile</h2><form action="#" onsubmit="return false">
<label class="fld"><span>Display name</span><input id="pf-name" type="text" value="Robin Ames"></label>
<label class="fld"><span>Contact email</span><input id="pf-mail" type="email" value="robin@marigold.example"></label>
<label class="fld"><span>Desk phone</span><input id="pf-phone" type="tel"></label><button class="ghost" type="button">Save profile</button></form></section>
<section class="card wide sect"><h2>Security</h2><form action="#" onsubmit="return false"><div class="tri">
<label><span class="lbl">Old</span><input id="sec-a" type="password"></label>
<label><span class="lbl">New</span><input id="sec-b" type="password"></label>
<label><span class="lbl">Verify</span><input id="sec-c" type="password"></label></div><button type="submit">Change</button></form></section></main><footer class="foot"><div><strong>Marigold CRM</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Marigold CRM</div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"current-password":r("#sec-a",[]),"new-password":r("#sec-b",[]),"confirm-password":r("#sec-c",[])};}};</script>
</body>
</html>
