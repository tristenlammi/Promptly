<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenwick Cycle Club</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Verdana, sans-serif;color:#1f2d24;background:#edf4ee}
a{color:#1f7a4d}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#1f5138;color:#fff}
.top a{color:inherit;text-decoration:none}
.top strong{font-size:1.15em;margin-right:12px}
.top nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
.top input{padding:5px 8px;border:1px solid #c5d8ca;border-radius:6px;background:#fff;color:#222;min-width:180px;width:auto}
main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #c5d8ca;border-radius:6px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}
h1{margin:0 0 8px;font-size:1.6em}h2{font-size:1.2em;margin:0 0 8px}
p.lead{margin:0 0 18px;opacity:.82}
.fld{display:block;margin:0 0 14px}
.fld>span,.lbl{display:block;font-weight:600;margin-bottom:4px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #c5d8ca;border-radius:6px;background:#fff;color:#222;width:100%}
input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 18px;border:0;border-radius:6px;background:#1f7a4d;color:#fff;cursor:pointer}
button.ghost{background:transparent;color:#1f7a4d;border:1px solid #1f7a4d}
.foot{margin-top:48px;padding:24px;border-top:1px solid #c5d8ca;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:24px}
</style>
</head>
<body>
<header class="top"><strong>Fenwick Cycle Club</strong><nav><a href="#">Rides</a><a href="#">Routes</a><a href="#">Kit shop</a></nav></header>
<main class="duo"><section class="card wide"><h2>First ride?</h2><p class="lead">Membership is free until spring.</p><form action="#" onsubmit="return false">
<label class="fld"><span>Email to join with</span><input name="e2" type="email"></label>
<label class="fld"><span>Choose a secret</span><input name="s2" type="password"></label>
<label class="fld"><span>Choose it again</span><input name="s3" type="password"></label>
<button class="ghost" type="submit">Join the club</button></form></section>
<section class="card wide"><h2>Already riding with us?</h2><p class="lead">Check this week's rides.</p><form action="#" onsubmit="return false">
<label class="fld"><span>Rider email</span><input name="e" type="email"></label>
<label class="fld"><span>Your secret</span><input name="s" type="password"></label>
<button type="submit">Clip in</button></form></section></main>
<footer class="foot"><div><strong>Fenwick Cycle Club</strong><ul><li><a href="#">About</a></li><li><a href="#">Help centre</a></li><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul></div><div class="muted">&copy; 2026 Fenwick Cycle Club</div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r("input[name=\"e\"]",[]),"password":r("input[name=\"s\"]",[])};}};</script>
</body>
</html>
