<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Trebuchet MS", sans-serif;color:#33202a;background:#fff6f7}
a{color:#b0305f}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:12px 24px;background:#7c2748;color:#fff}

main{max-width:980px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid #edcfd8;border-radius:20px;padding:24px;max-width:440px;margin:0 auto}
.wide{max-width:none;margin:0}

button.ghost{background:transparent;color:#b0305f;border:1px solid #b0305f}
.foot{margin-top:48px;padding:24px;border-top:1px solid #edcfd8;font-size:.9em;display:flex;flex-wrap:wrap;gap:32px;justify-content:space-between}
.foot ul{list-style:none;margin:0;padding:0}
.foot form{display:flex;gap:6px;max-width:340px}
.muted{opacity:.7;font-size:.9em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.boxes{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.boxes input{width:42px;text-align:center;font-size:1.3em;padding:8px 0}
[hidden]{display:none!important}

</style>
