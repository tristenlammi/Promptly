<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Promptly Passwords: passkey</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { margin: 0; padding: 16px; background: #faf9f7; color: #1a1a19; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #root { display: flex; flex-direction: column; gap: 8px; }
      button { font: inherit; border: 1px solid rgba(122,105,95,.3); background: #fff; color: inherit; border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; }
      button.primary { background: #d97757; border-color: #d97757; color: #fff; }
      input { font: inherit; width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid rgba(122,105,95,.3); border-radius: 8px; margin-bottom: 8px; }
      form { display: flex; flex-direction: column; }
      p { margin: 0; overflow-wrap: anywhere; }
      .err { color: #b42318; }
      .list { display: flex; flex-direction: column; gap: 6px; }
      .list label { display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; }
      .list input { width: auto; margin: 0; }
      @media (prefers-color-scheme: dark) { body { background: #1c1917; color: #f2f0ec; } button { background: #27231e; } input { background: #27231e; color: inherit; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="passkey.js"></script>
  </body>
</html>
