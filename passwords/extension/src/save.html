<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Promptly Passwords</title>
    <style>
      :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
      html, body { margin: 0; background: transparent; }
      #root:empty { display: none; }
      #root { background: #fff; color: #1a1a19; border: 1px solid rgba(122,105,95,.3); border-radius: 12px; padding: 12px; box-sizing: border-box; }
      .title { font-weight: 600; overflow-wrap: anywhere; }
      .sub { color: #5f6672; margin-top: 2px; overflow-wrap: anywhere; }
      .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      button { font: inherit; border: 1px solid rgba(122,105,95,.3); background: transparent; color: inherit; border-radius: 8px; padding: 5px 9px; cursor: pointer; }
      button.primary { background: #d97757; border-color: #d97757; color: #fff; }
      @media (prefers-color-scheme: dark) {
        #root { background: #27231e; color: #f2f0ec; }
        .sub { color: #b8b2a8; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="save.js"></script>
  </body>
</html>
