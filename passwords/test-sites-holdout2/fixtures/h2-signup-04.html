<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchard Lane Grocers</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,sans-serif;color:#1b1f24;background:#fff}a{color:#c2410c}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#c2410c;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.ts{max-width:420px;margin:0 auto}.tl{display:flex;margin-bottom:16px}.tl button{flex:1;background:#eee;color:#333;border-radius:0}.tl button.on{background:#c2410c;color:#fff}.pn div{margin-bottom:10px}
</style>
</head>
<body>
<header><b>Orchard Lane</b><a href="#">Weekly box</a></header>
<main><div class="ts"><div class="tl"><button class="t-a" type="button">I have an account</button><button class="t-b on" type="button">I'm new here</button></div>
<div class="pn" id="pa" hidden><form onsubmit="return false"><div><input id="in-e" type="text" placeholder="Email"></div><div><input id="in-p" type="password" placeholder="Password"></div><button>Sign in</button></form></div>
<div class="pn" id="pb"><form onsubmit="return false"><div><label for="up-e">Email</label><input id="up-e" type="text"></div><div><label for="up-p">Password (8 characters or more)</label><input id="up-p" type="password"></div><div><label for="up-c">Confirm password</label><input id="up-c" type="password"></div><button>Create account</button></form></div></div></main>
<footer><form onsubmit="return false" style="display:flex;gap:6px"><input id="nws" type="text" placeholder="Email me the weekly specials"><button type="button">Yes please</button></form><span>Orchard Lane Grocers</span></footer>
<script>document.querySelector('.t-a').addEventListener('click',function(){document.getElementById('pb').hidden=true;document.getElementById('pa').hidden=false;});document.querySelector('.t-b').addEventListener('click',function(){document.getElementById('pa').hidden=true;document.getElementById('pb').hidden=false;});</script>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"email":r("#up-e",[]),"new-password":r("#up-p",[]),"confirm-password":r("#up-c",[])};}};</script>
</body>
</html>
