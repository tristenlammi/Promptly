<!doctype html>
<html lang="en">
<head>

<title>Tidewell Energy - Mobile confirmation</title>

<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1b1f24;background:#ecfeff}a{color:#0e7490}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#0e7490;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.q4{display:flex;gap:8px;margin:14px 0}.q4 input{width:56px;height:56px;text-align:center;font-size:1.4em;padding:0;-moz-appearance:textfield}.q4 input::-webkit-outer-spin-button,.q4 input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.pg{max-width:420px;margin:60px auto}

</head>
<body>
<div class="pg"><h1>Mobile confirmation</h1><div id="hold"><p>Sending your code&hellip;</p></div><p style="margin-top:14px"><a href="#" id="alt">Use a backup code</a></p><form id="bk" hidden onsubmit="return false"><label for="bu">Backup code</label><input id="bu" type="text"><p style="margin-top:8px"><button>Use it</button></p></form></div>
<script>setTimeout(function(){document.getElementById('hold').innerHTML='<p>Enter the 4 digits we just texted you.</p><form onsubmit="return false"><div class="q4"><input type="number"><input type="number"><input type="number"><input type="number"></div><button>Confirm</button></form>';(function(){var b=[].slice.call(document.querySelectorAll('.q4 input'));b.forEach(function(x,i){x.addEventListener('input',function(){if(x.value.length>1)x.value=x.value.slice(-1);if(x.value&&b[i+1])b[i+1].focus();});x.addEventListener('keydown',function(ev){if(ev.key==='Backspace'&&!x.value&&b[i-1])b[i-1].focus();});x.addEventListener('paste',function(ev){var t=(ev.clipboardData.getData('text')||'').replace(/[^0-9]/g,'');if(!t)return;ev.preventDefault();b.forEach(function(y,j){if(t[j]!==undefined)y.value=t[j];});});});})();},500);document.getElementById('alt').addEventListener('click',function(ev){ev.preventDefault();document.getElementById('hold').hidden=true;document.getElementById('bk').hidden=false;});</script>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"otp":r(".q4 input:nth-of-type(1)",[])+r(".q4 input:nth-of-type(2)",[])+r(".q4 input:nth-of-type(3)",[])+r(".q4 input:nth-of-type(4)",[])};}};</script>
</body>
</html>
