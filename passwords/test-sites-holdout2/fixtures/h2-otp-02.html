<main><div class="cn"><h1>Confirm it's you</h1><p>We sent a code to pilot&bull;&bull;&bull;@gullwing.example</p><form onsubmit="return false"><div class="Dg"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 1 of 6"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 2 of 6"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 3 of 6"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 4 of 6"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 5 of 6"><input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 6 of 6"></div><button>Confirm</button></form><p style="margin-top:12px"><a href="#">Send another</a></p></div></main>
<script>(function(){var b=[].slice.call(document.querySelectorAll('.Dg input'));b.forEach(function(x,i){x.addEventListener('input',function(){if(x.value.length>1)x.value=x.value.slice(-1);if(x.value&&b[i+1])b[i+1].focus();});x.addEventListener('keydown',function(ev){if(ev.key==='Backspace'&&!x.value&&b[i-1])b[i-1].focus();});x.addEventListener('paste',function(ev){var t=(ev.clipboardData.getData('text')||'').replace(/[^0-9]/g,'');if(!t)return;ev.preventDefault();b.forEach(function(y,j){if(t[j]!==undefined)y.value=t[j];});});});})();</script>
