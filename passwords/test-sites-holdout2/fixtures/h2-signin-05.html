<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrowbone Cycling Club</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,sans-serif;color:#1b1f24;background:#fafafa}a{color:#b3261e}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#b3261e;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
[role=tablist]{display:flex;gap:4px;border-bottom:2px solid #b3261e;margin-bottom:18px}[role=tab]{background:#eee;color:#222;border-radius:4px 4px 0 0}[role=tab][aria-selected=true]{background:#b3261e;color:#fff}.bx{max-width:440px;margin:0 auto}.rw{margin-bottom:12px}.rw label{display:block;margin-bottom:3px}
</style>
</head>
<body>
<header style="background:#222;color:#fff"><b>Marrowbone CC</b><a href="#" style="color:#fff">Rides</a><a href="#" style="color:#fff">Results</a></header>
<main><div class="bx"><div role="tablist"><button role="tab" id="t0" aria-selected="true" aria-controls="p0" type="button">Sign in</button><button role="tab" id="t1" aria-selected="false" aria-controls="p1" type="button">Register</button></div>
<div role="tabpanel" id="p0"><form onsubmit="return false"><div class="rw"><label for="a1">Rider email</label><input id="a1" type="email"></div><div class="rw"><label for="a2">Password</label><input id="a2" type="password"></div><button>Sign in</button></form></div>
<div role="tabpanel" id="p1" hidden><form onsubmit="return false"><div class="rw"><label for="b0">Your name</label><input id="b0" type="text"></div><div class="rw"><label for="b1">Rider email</label><input id="b1" type="email"></div><div class="rw"><label for="b2">Password</label><input id="b2" type="password"></div><div class="rw"><label for="b3">Password again</label><input id="b3" type="password"></div><button>Join the club</button></form></div></div></main>
<script>document.getElementById('t1').addEventListener('click',function(){document.getElementById('p0').hidden=true;document.getElementById('p1').hidden=false;this.setAttribute('aria-selected','true');document.getElementById('t0').setAttribute('aria-selected','false');});document.getElementById('t0').addEventListener('click',function(){document.getElementById('p1').hidden=true;document.getElementById('p0').hidden=false;this.setAttribute('aria-selected','true');document.getElementById('t1').setAttribute('aria-selected','false');});</script>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"email":r("#a1",[]),"password":r("#a2",[])};}};</script>

</html>
