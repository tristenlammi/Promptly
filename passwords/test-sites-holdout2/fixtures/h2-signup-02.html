<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dovetail Guild - Join</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Palatino,serif;color:#1b1f24;background:#f8f4ec}a{color:#6d4c1f}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:3px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:3px;background:#6d4c1f;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.g7{max-width:460px;margin:0 auto;display:grid;gap:10px}.g7 .h{display:flex;gap:8px}
</style>
</head>
<body>
<header><b>Dovetail Guild</b><a href="#">Workshops</a></header>
<main><h1 style="text-align:center">Join the guild</h1><form class="g7" onsubmit="return false"><div class="h c1"><input type="text" placeholder="First name"><input type="text" placeholder="Last name"></div><div class="c2"><input type="text" placeholder="Email address"></div><div class="c3"><input type="text" placeholder="Pick a username"></div><div class="c4"><input type="password" placeholder="Password"></div><div class="c5"><input type="password" placeholder="Password again"></div><div class="h c6"><select><option value="">Birth day</option><option>1</option><option>2</option></select><select><option value="">Month</option><option>Jan</option><option>Feb</option></select><select><option value="">Year</option><option>1990</option><option>1991</option></select></div><div class="c7"><input type="text" placeholder="Referral code (if a member sent you)"></div><button>Join</button></form></main>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"first-name":r(".c1 input:nth-of-type(1)",[]),"last-name":r(".c1 input:nth-of-type(2)",[]),"email":r(".c2 input",[]),"username":r(".c3 input",[]),"new-password":r(".c4 input",[]),"confirm-password":r(".c5 input",[])};}};</script>
</body>
