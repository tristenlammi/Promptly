<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Tahoma,sans-serif;color:#1b1f24;background:#e9edf2}a{color:#123c69}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}

<div><h2>Departures board</h2><form onsubmit="return false"><div class="f"><label for="dp">Departures from</label><input id="dp" name="st" type="text" placeholder="Station name"></div><button type="button">Show trains</button></form></div></div></main>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
