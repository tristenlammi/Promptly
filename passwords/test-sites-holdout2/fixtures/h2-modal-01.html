<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudberry Stays</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1b1f24;background:#fff}a{color:#be123c}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#be123c;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.hr{background:#ffe4e6;padding:32px;border-radius:12px}.hr form{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.hr input{flex:1;min-width:150px}.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}.dl{background:#fff;padding:26px;border-radius:12px;width:360px;max-width:92vw}.dl label{display:block;margin:10px 0 3px}.lgn{background:transparent;color:#be123c;border:1px solid #be123c}
</style>
</head>
<body>
<header><b>Cloudberry Stays</b><a href="#">Cabins</a><button class="lgn" type="button">Log in</button></header>
<main><div class="hr"><h1>Find a quiet week</h1><form onsubmit="return false"><input id="w-d" type="text" placeholder="Where to?"><input id="w-g" type="text" placeholder="Guests"><button type="button">Search</button></form></div></main>
<script>document.querySelector('.lgn').addEventListener('click',function(){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dl" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Welcome back</h2><form onsubmit="return false"><label for="dl1">Email</label><input id="dl1" type="text"><label for="dl2">Password</label><input id="dl2" type="password"><p style="margin-top:12px"><button>Log in</button></p></form></div>';document.body.appendChild(o);});</script>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"email":r("#dl1",[]),"password":r("#dl2",[])};}};</script>
</body>
</html>
