<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollenhaus - Your account</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1b1f24;background:#fff}a{color:#2f6b3c}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:999px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:999px;background:#2f6b3c;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
header{border-bottom:1px solid #e3e6df}header input{width:240px}.grid{display:flex;gap:40px;flex-wrap:wrap}.grid>section{flex:1;min-width:260px;border:1px solid #e3e6df;border-radius:14px;padding:22px}.mb-3{margin-bottom:12px}
</style>
</head>
<body>
<header><b>Pollenhaus</b><a href="#">Bulbs</a><a href="#">Seed</a><a href="#">Tools</a><form class="flex" onsubmit="return false"><input class="px-3 py-1 text-sm" id="s-top" type="text" placeholder="Search the shop"></form></header>
<main><div class="grid"><section class="col-a"><h2>Returning gardeners</h2><form class="flex flex-col" onsubmit="return false"><input class="mb-3 px-3 py-2 text-sm" type="text" placeholder="Email" autocomplete="off"><input class="mb-3 px-3 py-2 text-sm" type="password" placeholder="Password" autocomplete="off"><button class="w-full">Sign in</button></form><p style="margin-top:10px"><a href="#">Forgotten it?</a></p></section>
<section class="col-b"><h2>New to Pollenhaus?</h2><p>Tell us where to send your first planting guide and we'll set up the rest.</p><form onsubmit="return false"><input class="mb-3 px-3 py-2 text-sm" type="text" placeholder="Email" autocomplete="off"><button class="w-full">Start an account</button></form></section></div></main>
<footer><div><b>Monthly bloom notes</b><form onsubmit="return false" style="display:flex;gap:6px;margin-top:6px"><input id="nl-b" type="email" placeholder="you@garden.example"><button>Join</button></form></div><div><a href="#">Delivery</a> <a href="#">Returns</a></div></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"email":r(".col-a input[type=\"text\"]",[]),"password":r(".col-a input[type=\"password\"]",[])};}};</script>
</body>
</html>
