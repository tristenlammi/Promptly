<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Calibri,sans-serif;color:#1b1f24;background:#f1f7f9}a{color:#00607a}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#00607a;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
header select{width:auto}.c8{max-width:400px;margin:0 auto;background:#fff;border-radius:8px;padding:24px;border:1px solid #cfe3ea}.r2{margin-bottom:12px}.r2 span{display:block;font-size:.9em;color:#345}
</style>
</head>
<body>
<header><b>Harbourline Dental Cloud</b><select name="lng" id="lng"><option value="en">English</option><option value="fr">Fran&ccedil;ais</option></select></header>
<main><form class="c8" onsubmit="return false"><h1>Open your practice</h1><label class="r2" style="display:block"><span>Practice code</span><input name="a" type="text" placeholder="HL-0000"></label><label class="r2" style="display:block"><span>Login</span><input name="b" type="text"></label><label class="r2" style="display:block"><span>Password</span><input name="c" type="password"></label><button>Open</button></form></main>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r("input[name=\"b\"]",[]),"password":r("input[name=\"c\"]",[])};}};</script>
