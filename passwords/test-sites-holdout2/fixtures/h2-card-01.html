<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1b1f24;background:#f8fafc}a{color:#1d4ed8}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:6px;background:#1d4ed8;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.co{display:flex;gap:26px;flex-wrap:wrap}.co>div{flex:1;min-width:280px;background:#fff;padding:20px;border-radius:8px}.co label{display:block;margin:10px 0 3px}.tw{display:flex;gap:10px}.tw>div{flex:1}

</head>
<body>
<header><b>Pelican Prints</b></header>
<main><div class="co"><div><h2>Payment</h2><form onsubmit="return false"><label for="pn">Name on card</label><input id="pn" type="text"><label for="pc">Card number</label><input id="pc" type="text" inputmode="numeric" maxlength="19"><div class="tw"><div><label for="pe">Expiry</label><input id="pe" type="text" placeholder="MM / YY" maxlength="7"></div><div><label for="ps">Security code</label><input id="ps" type="text" inputmode="numeric" maxlength="4"></div></div><p style="margin-top:14px"><button>Pay $48.00</button></p></form></div>
<div><h2>Your order</h2><p>A2 print, Harbour at dusk &times; 1</p><form onsubmit="return false"><label for="pr">Promo code</label><input id="pr" type="text"><label for="nt">Note for the framer</label><textarea id="nt" rows="2"></textarea></form></div></div></main>
<script>function cardFmt(el){el.addEventListener('input',function(){var d=el.value.replace(/[^0-9]/g,'').slice(0,16);el.value=d.replace(/(.{4})(?=.)/g,'$1 ');});}
function expFmt(el){el.addEventListener('input',function(){var d=el.value.replace(/[^0-9]/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+' / '+d.slice(2):d;});}
cardFmt(document.getElementById('pc'));expFmt(document.getElementById('pe'));</script>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"card-name":r("#pn",[]),"card-number":r("#pc",[]),"card-exp":r("#pe",[]),"card-cvv":r("#ps",[])};}};</script>
