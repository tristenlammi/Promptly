<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zephyr Modellers Forum</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:12px/1.5 Verdana,Arial,sans-serif;color:#1b1f24;background:#dfe4ee}a{color:#334f8a}h1{font-size:1.5em;margin:0 0 10px}h2{font-size:1.15em;margin:0 0 8px}p{margin:0 0 12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd5dc;border-radius:0;background:#fff;color:#222;width:100%}input[type=checkbox],input[type=radio]{width:auto}
button{font:inherit;padding:9px 16px;border:0;border-radius:0;background:#334f8a;color:#fff;cursor:pointer}[hidden]{display:none!important}
header{padding:12px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{margin-right:auto}main{max-width:960px;margin:28px auto;padding:0 20px}footer{margin-top:40px;padding:18px 24px;border-top:1px solid #cfd5dc;font-size:.9em;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
table{border-collapse:collapse}.tb{background:#334f8a;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.tb td{padding:1px 4px}.tb input{padding:2px 4px;width:120px}.tb input[type=checkbox]{width:auto}.tb button,.tb input[type=submit]{padding:2px 8px}.th{background:#fff;border:1px solid #9aa;padding:8px;margin-bottom:6px}
</style>
</head>
<body>
<div class="tb"><b>Zephyr Modellers Forum</b><form action="#" onsubmit="return false"><table><tr><td><input name="fm_user" type="text" value="User Name" onfocus="if(this.value==this.defaultValue)this.value=''"></td><td><label><input type="checkbox" name="fm_rem"> Remember Me?</label></td></tr><tr><td><input name="fm_pass" type="password" title="Password"></td><td><input type="submit" value="Log in" style="width:auto;background:#fff;color:#223"></td></tr></table></form></div>
<main style="max-width:none;margin:10px;padding:0"><div class="th"><form onsubmit="return false"><input name="fm_q" type="text" placeholder="Search threads" style="max-width:240px"> <button type="button">Go</button></form></div>
<div class="th"><b>Scale gearbox for a 1:32 rail car?</b><p>Anyone machined one of these from brass stock? Mine keeps binding.</p></div><div class="th"><b>Quick reply</b><textarea name="fm_msg" rows="3" placeholder="Log in to reply, or write as a guest"></textarea><button type="button" style="margin-top:6px">Post</button></div></main>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r("input[name=\"fm_user\"]",[]),"password":r("input[name=\"fm_pass\"]",[])};}};</script>
</body>
</html>
