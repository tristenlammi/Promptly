<!doctype html><title>Sign in</title><style>body{margin:0}label{font-size:0}#user{position:absolute;left:10px;top:0;width:200px}#pass{position:absolute;left:10px;top:30px;width:200px}#go{position:absolute;left:230px;top:0}</style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form><script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));}; addEventListener('load',()=>setTimeout(()=>opener('user'),900));</script>
