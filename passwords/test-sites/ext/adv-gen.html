<!doctype html><title>Change your password</title><style>body{margin:0}label{font-size:0}#a{position:fixed;left:100px;top:100px}#b{position:fixed;left:100px;top:130px}#c{position:fixed;left:100px;top:160px}</style><h1 style="font-size:0">Change password</h1><form id="f" onsubmit="event.preventDefault()"><input id="a" name="current_password" type="password" autocomplete="current-password"><input id="b" name="new_password" type="password" autocomplete="new-password"><input id="c" name="confirm_password" type="password" autocomplete="new-password"><button type="submit" style="font-size:0">Change password</button></form>
<div id="cover" popover="manual" style="position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#fff;pointer-events:none;font:30px sans-serif"><div style="position:absolute;left:150px;top:160px;background:#2a7;color:#fff;padding:20px">CLAIM YOUR PRIZE</div></div>
<script>const q=new URLSearchParams(location.search);window.__state=()=>({b:document.getElementById('b').value});addEventListener('load',()=>setTimeout(()=>{const b=document.getElementById('b');if(q.get('how')==='focus')b.focus();else b.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));if(q.get('cover')!=='0')setTimeout(()=>document.getElementById('cover').showPopover(),150);},600));</script>
