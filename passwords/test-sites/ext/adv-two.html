<!doctype html><title>Two menus</title><style>body{margin:0}label{font-size:0}#user{position:fixed;right:20px;bottom:290px;width:300px}#pass{position:fixed;right:20px;bottom:262px;width:300px}#go{display:none}iframe{position:fixed;left:100px;top:100px;width:400px;height:320px;border:0;opacity:0.001}</style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form>
<div style="position:fixed;left:150px;top:160px;background:#2a7;color:#fff;padding:20px;font:30px sans-serif;z-index:-1">CLAIM YOUR PRIZE</div>
<iframe id="kid"></iframe>
<script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));}; document.getElementById('kid').src=q.get('src')||('adv-two-frame.html?how='+(q.get('how')||''));addEventListener('load',()=>setTimeout(()=>opener('user'),600));</script>
