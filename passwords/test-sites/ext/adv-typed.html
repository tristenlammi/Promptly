<!doctype html><title>Sign in</title><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form><div id="cover" popover="manual" style="position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#fff;pointer-events:none;font:30px sans-serif"><div style="position:absolute;left:150px;top:160px;background:#2a7;color:#fff;padding:20px">CLAIM YOUR PRIZE</div></div><script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));};
// A person really types here. Submitting takes the form away and ?cover=1 hides the question that follows, until the press.
const f=document.getElementById('f');const cover=document.getElementById('cover');
f.addEventListener('submit',()=>{setTimeout(()=>f.remove(),100);if(q.get('cover')!=='1')return;new MutationObserver((rs)=>{if(!rs.some((r)=>r.addedNodes.length))return;setTimeout(()=>{if(cover.matches(':popover-open'))cover.hidePopover();cover.showPopover();},100);}).observe(document.documentElement,{childList:true});const drop=()=>{if(cover.matches(':popover-open'))cover.hidePopover();};addEventListener('blur',drop);});</script>
