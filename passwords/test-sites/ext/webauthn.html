<!doctype html>
<html>
  <head><title>WebAuthn test site</title></head>
  <body>
    <h1>WebAuthn test relying party</h1>
    <p>The test harness verifies what this page gets with an independent server library.</p>
    <script>
      const b64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

      window.__register = async (o) => {
        try {
          const c = await navigator.credentials.create({
            publicKey: {
              rp: { name: "Test RP", id: o.rpId },
              user: { id: unb64u(o.userId), name: o.userName, displayName: o.userName },
              challenge: unb64u(o.challenge),
              pubKeyCredParams: [{ type: "public-key", alg: -7 }],
              excludeCredentials: (o.exclude ?? []).map((id) => ({ type: "public-key", id: unb64u(id) })),
              authenticatorSelection: { residentKey: "required", userVerification: o.uv ?? "preferred" },
              attestation: "none",
            },
          });
          return {
            isReal: c instanceof PublicKeyCredential,
            id: c.id,
            rawId: b64u(c.rawId),
            type: c.type,
            authenticatorAttachment: c.authenticatorAttachment,
            clientExtensionResults: c.getClientExtensionResults(),
            response: {
              clientDataJSON: b64u(c.response.clientDataJSON),
              attestationObject: b64u(c.response.attestationObject),
              transports: c.response.getTransports(),
            },
          };
        } catch (e) {
          return { error: e.name };
        }
      };

      const shape = (c) => ({
        id: c.id,
        rawId: b64u(c.rawId),
        type: c.type,
        clientExtensionResults: c.getClientExtensionResults(),
        response: {
          clientDataJSON: b64u(c.response.clientDataJSON),
          authenticatorData: b64u(c.response.authenticatorData),
          signature: b64u(c.response.signature),
          userHandle: c.response.userHandle ? b64u(c.response.userHandle) : undefined,
        },
      });

      /** A sign-in box's suggestions: stays open until someone answers, or it's called off. */
      window.__ask = (o, mediation) => {
        window.__stop = new AbortController();
        window.__result = null;
        navigator.credentials
          .get({ ...(mediation ? { mediation } : {}), signal: window.__stop.signal, publicKey: { rpId: o.rpId, challenge: unb64u(o.challenge), allowCredentials: (o.allow ?? []).map((id) => ({ type: "public-key", id: unb64u(id) })), userVerification: "preferred" } })
          .then((c) => (window.__result = shape(c)), (e) => (window.__result = { error: e.name }));
      };

      window.__auth = async (o) => {
        try {
          const c = await navigator.credentials.get({
            publicKey: {
              rpId: o.rpId,
              challenge: unb64u(o.challenge),
              allowCredentials: (o.allow ?? []).map((id) => ({ type: "public-key", id: unb64u(id) })),
              userVerification: "preferred",
            },
          });
          return {
            id: c.id,
            rawId: b64u(c.rawId),
            type: c.type,
            clientExtensionResults: c.getClientExtensionResults(),
            response: {
              clientDataJSON: b64u(c.response.clientDataJSON),
              authenticatorData: b64u(c.response.authenticatorData),
              signature: b64u(c.response.signature),
              userHandle: c.response.userHandle ? b64u(c.response.userHandle) : undefined,
            },
          };
        } catch (e) {
          return { error: e.name };
        }
      };
    </script>
    <form onsubmit="return false"><label>Email <input id="user" name="username" autocomplete="username webauthn"></label> <button>Next</button></form>
    <script>
      // Asked as the page loads, with no click behind it, as some sign-in steps do.
      const q = new URLSearchParams(location.search);
      if (q.get("auto")) window.__ask({ rpId: q.get("rp"), challenge: q.get("auto"), allow: q.get("allow") ? [q.get("allow")] : [] }, q.get("m") || undefined);
    </script>
  </body>
</html>
