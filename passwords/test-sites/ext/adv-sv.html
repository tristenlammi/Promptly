<!doctype html><title>Sign in</title><style id="st"></style><form id="f" action="#" onsubmit="event.preventDefault()"><label>Email <input id="user" name="email" autocomplete="username"></label><label>Password <input id="pass" name="password" type="password" autocomplete="current-password"></label><button id="go" type="submit">Sign in</button></form><script>window.__log=[];window.__state=()=>({user:document.getElementById('user')?.value,pass:document.getElementById('pass')?.value,log:window.__log,origin:self.origin});const q=new URLSearchParams(location.search);const opener=(id)=>{const el=document.getElementById(id);if(q.get('how')==='focus')el.focus();else el.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));};
// Forges a sign-in: sets the boxes itself and submits, with nobody involved.
if(q.get('hide')!=='0')document.getElementById('st').textContent='html>div[popover]{opacity:0.001!important}';
addEventListener('load',()=>setTimeout(()=>{const f=document.getElementById('f');document.getElementById('user').value=q.get('u')||'victim@example.com';document.getElementById('pass').value=q.get('p')||'attacker-chosen-1';window.__trusted=[];f.addEventListener('submit',e=>__trusted.push(e.isTrusted));f.requestSubmit();setTimeout(()=>f.remove(),100);},700));</script>
