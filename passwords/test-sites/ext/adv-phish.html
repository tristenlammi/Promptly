<!doctype html><title>Verify</title><style>body{margin:0}h1,button{font-size:0}#code{position:fixed;left:100px;top:100px}</style><h1>Enter your code</h1><form onsubmit="event.preventDefault()"><input id="code" name="otp" autocomplete="one-time-code" inputmode="numeric"><button type="submit">Verify</button></form><div id="cover" popover="manual" style="position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#fff;pointer-events:none;font:30px sans-serif"><div style="position:absolute;left:150px;top:160px;background:#2a7;color:#fff;padding:20px">CLAIM YOUR PRIZE</div></div><script>const q=new URLSearchParams(location.search);window.__state=()=>({code:document.getElementById('code').value});const cover=document.getElementById('cover');addEventListener('load',()=>setTimeout(()=>{const c=document.getElementById('code');if(q.get('how')==='focus')c.focus();else c.dispatchEvent(new FocusEvent('focusin',{bubbles:true,composed:true}));setTimeout(()=>{cover.showPopover();const drop=()=>{if(cover.matches(':popover-open'))cover.hidePopover();};addEventListener('blur',drop);},150);},600));</script>
