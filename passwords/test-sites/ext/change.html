<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Change your password</title></head>
<body>
<h1>Change your password</h1>
<form onsubmit="return false">
  <label for="current">Current password</label>
  <input id="current" type="password" autocomplete="current-password">
  <label for="next">New password</label>
  <input id="next" type="password" autocomplete="new-password">
  <label for="again">Confirm new password</label>
  <input id="again" type="password" autocomplete="new-password">
  <button type="submit">Change password</button>
</form>
<script>window.__state = () => ({ current: document.getElementById("current").value, next: document.getElementById("next").value, again: document.getElementById("again").value });</script>
</body>
</html>
