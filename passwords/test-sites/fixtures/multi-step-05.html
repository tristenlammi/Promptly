<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvetine</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}

.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}

</style>

</head>
<body>

<main class="wrap">
<div class="narrow box" id="view" style="margin-top:60px"></div>
</main>
<div class="legal-line">&copy; 2026 Velvetine Cloud, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>


<script>
var S={username:'',password:'',otp:''};var v=document.getElementById('view');
function bind(id,key){var i=document.getElementById(id);i.addEventListener('input',function(){S[key]=i.value;});}
function one(){v.innerHTML='<h1>Sign in</h1><div class="row"><label for="v-user">Username</label><input id="v-user" autocomplete="username"></div><button id="v-next1" type="button">Next</button>';bind('v-user','username');document.getElementById('v-next1').onclick=two;}
function two(){v.innerHTML='<h1>Password</h1><p class="muted" id="v-who"></p><div class="row"><label for="v-pass">Password</label><input id="v-pass" type="password" autocomplete="current-password"></div><button id="v-next2" type="button">Next</button>';document.getElementById('v-who').textContent=S.username;bind('v-pass','password');document.getElementById('v-next2').onclick=three;}
function three(){v.innerHTML='<h1>Two-factor check</h1><p>Enter the code from your authenticator app.</p><div class="row"><label for="v-totp">6-digit code</label><input id="v-totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button type="button">Verify</button><p class="muted"><a href="#">Use a backup code instead</a></p>';bind('v-totp','otp');}
one();window.__fixture={state:function(){return S;}};
</script>
</body>
</html>
