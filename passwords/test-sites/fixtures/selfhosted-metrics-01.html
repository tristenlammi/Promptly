<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Dash</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}


.ld{max-width:480px;margin:80px auto;text-align:center}.ld-form{text-align:left;margin-top:28px}.ld-form label{display:block;margin:14px 0 4px;font-weight:500}.ld-form input{width:100%}.ld-btn{width:100%;margin-top:18px}.ld-or{margin:24px 0 10px;color:var(--soft)}.ld-sso{width:100%;margin:6px 0;background:#2a2f3c}
</style>

</head>
<body>

<div class="ld"><h1>Welcome to Lumen Dash</h1><form class="ld-form" id="ld-form" onsubmit="return false">
<label for="ld-user">Email or username</label><input id="ld-user" name="user" placeholder="email or username" aria-label="Username input field" autocomplete="username" autocapitalize="none">
<label for="current-password">Password</label><input id="current-password" name="password" type="password" placeholder="password" aria-label="Password input field" autocomplete="current-password">
<button type="submit" class="ld-btn" aria-label="Login button">Log in</button><p style="text-align:right"><a href="#">Forgot your password?</a></p></form>
<div class="ld-or">or</div><button type="button" class="ld-sso">Sign in with Teaforge</button><button type="button" class="ld-sso">Sign in with Gatekeep</button></div>



<script>
var S={username:'',password:''};window.__fixture={state:function(){return S;}};
function bind(el,key){el.addEventListener('input',function(){S[key]=el.value;});}
['ld-user','current-password'].forEach(function(id,k){var el=document.getElementById(id);var key=k?'password':'username';
 // Controlled: the model takes input events, and every render writes the model back.
 el.addEventListener('input',function(){S[key]=el.value;});el.addEventListener('blur',function(){el.value=S[key];});});
</script>
</body>
</html>
