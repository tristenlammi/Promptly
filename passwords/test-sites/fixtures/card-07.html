<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose how to pay</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f1f5ef;--fg:#1d2a1f;--soft:#58695b;--line:#cdd9cc;--accent:#2f7a4a;--card:#fcfefb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Verdana, Geneva, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.site-header{display:flex;gap:18px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}.site-header nav a{margin-right:14px;text-decoration:none}.site-header form{margin-left:auto;display:flex;gap:6px}.site-logo{font-weight:700;font-size:1.15em;text-decoration:none}
.footer__signup{margin-top:48px;padding:24px;background:var(--fg);color:var(--bg)}.footer__signup input{color:#222;background:#fff;margin-right:6px}.footer__signup span{display:block;margin-bottom:8px}

</style>

</head>
<body>
<header class="site-header">
  <a class="site-logo" href="#home">Acme Harvest</a>
  <nav aria-label="Main"><a href="#products">Products</a><a href="#pricing">Pricing</a><a href="#resources">Resources</a><a href="#support">Support</a></nav>
  <form role="search" action="#search" onsubmit="return false"><input type="search" name="q" id="site-search" placeholder="Search" aria-label="Search this site"><button type="submit">Go</button></form>
</header>
<main class="wrap">
<form class="narrow box" onsubmit="return false"><h1>How would you like to pay?</h1><p><label><input type="radio" name="pm" id="pm-saved" checked> Card ending 4242</label></p><p><label><input type="radio" name="pm" id="pm-new"> Use a new card</label></p><fieldset id="new-card" hidden><legend>New card</legend><div class="row"><label for="nc-num">Card number</label><input id="nc-num" name="new_card_number" autocomplete="cc-number"></div><div class="row"><label for="nc-exp">Expiry</label><input id="nc-exp" name="new_card_exp" autocomplete="cc-exp"></div><div class="row"><label for="nc-cvv">CVV</label><input id="nc-cvv" name="new_card_cvv" autocomplete="cc-csc"></div><div class="row"><label for="nc-name">Name on card</label><input id="nc-name" name="new_card_name" autocomplete="cc-name"></div></fieldset><button>Pay</button></form>
</main>
<div class="footer__signup"><span>Deals and updates from Acme Harvest, straight to your inbox.</span><input id="footer-email" type="text" name="EMAIL" placeholder="Email address"><button type="button">Sign me up</button><p class="muted">No spam. Privacy policy applies.</p></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"card-number":q("#nc-num"),"card-exp":q("#nc-exp"),"card-cvv":q("#nc-cvv"),"card-name":q("#nc-name")};}};</script>
<script>
document.querySelectorAll('input[name=pm]').forEach(function(x){x.addEventListener('change',function(){document.getElementById('new-card').hidden=!document.getElementById('pm-new').checked;});});
</script>
</body>
</html>
