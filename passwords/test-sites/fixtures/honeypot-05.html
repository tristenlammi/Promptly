<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarnhold sign-in</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.bare-logo{padding:28px 0 0;text-align:center;font-size:1.5em;font-weight:700;letter-spacing:.02em}
.footer__signup{margin-top:48px;padding:24px;background:var(--fg);color:var(--bg)}.footer__signup input{color:#222;background:#fff;margin-right:6px}.footer__signup span{display:block;margin-bottom:8px}
.nope-a{transform:translateX(-200vw);position:absolute}.nope-b{opacity:0;height:1px;width:1px;position:absolute}.nope-c{height:0;overflow:hidden}.nope-d{display:none}
</style>

</head>
<body>
<div class="bare-logo">Tarnhold Cloud</div>
<main class="wrap">
<form class="narrow box" onsubmit="return false"><h1>Sign in</h1>
  <input id="d1" name="login" type="text" hidden>
  <input id="d2" name="password" type="password" class="nope-d">
  <input id="d3" name="user_login" type="text" class="nope-a" tabindex="-1">
  <div class="row"><label for="th-a">Account</label><input id="th-a" name="a1"></div>
  <div class="nope-c"><label for="d4">Password</label><input id="d4" name="user_pass" type="password"></div>
  <div class="row"><label for="th-b">Password</label><input id="th-b" name="a2" type="password"></div>
  <input id="d5" name="pass_confirm" type="password" class="nope-b" tabindex="-1">
  <input id="d6" name="email" type="hidden">
  <button>Sign in</button></form>
</main>
<div class="footer__signup"><span>Deals and updates from Tarnhold Cloud, straight to your inbox.</span><input id="footer-email" type="text" name="EMAIL" placeholder="Email address"><button type="button">Sign me up</button><p class="muted">No spam. Privacy policy applies.</p></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#th-a"),"password":q("#th-b")};}};</script>

</body>
</html>
