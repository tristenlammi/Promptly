<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose an account</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#ffffff;--fg:#222222;--soft:#666666;--line:#d8d8d8;--accent:#00587a;--card:#f7f9fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Arial, Helvetica, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}

.lang-foot{display:flex;justify-content:space-between;padding:16px 28px;font-size:.85em;color:var(--soft);flex-wrap:wrap;gap:10px}
.chooser{list-style:none;padding:0}.chooser li{padding:10px;border-bottom:1px solid var(--line)}.gcard{max-width:440px;margin:60px auto;padding:36px;border:1px solid var(--line);border-radius:10px}
</style>

</head>
<body>

<main class="wrap">
<div class="gcard" id="app"><h1>Choose an account</h1><ul class="chooser"><li><a href="#">Pat Example<br><small>pat@example.test</small></a></li><li><a href="#">Robin Sample<br><small>robin@example.test</small></a></li><li><button type="button" class="linkbtn" id="use-another">Use another account</button></li></ul></div>
</main>
<div class="lang-foot"><select aria-label="Language" name="hl"><option>English (United States)</option><option>English (United Kingdom)</option><option>Espa&ntilde;ol</option></select><span><a href="#">Help</a> &nbsp; <a href="#">Privacy</a> &nbsp; <a href="#">Terms</a> &nbsp; Galdric</span></div>


<script>
var S={username:'',password:''};var a=document.getElementById('app');window.__fixture={state:function(){return S;}};
document.getElementById('use-another').addEventListener('click',function(){a.innerHTML='<h1>Sign in</h1><div class="row"><label for="ac-id">Email or phone</label><input id="ac-id" type="text" name="identifier"></div><button id="ac-next" type="button">Next</button>';var i=document.getElementById('ac-id');i.addEventListener('input',function(){S.username=i.value;});document.getElementById('ac-next').addEventListener('click',function(){a.innerHTML='<h1>Hi there</h1><div class="row"><label for="ac-pw">Enter your password</label><input id="ac-pw" type="password" name="password"></div><button type="button">Next</button>';var p=document.getElementById('ac-pw');p.addEventListener('input',function(){S.password=p.value;});});});
</script>
</body>
</html>
