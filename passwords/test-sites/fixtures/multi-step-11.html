<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ironfern SSO</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}

.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}
.digits{display:flex;gap:6px}.digits input{width:42px;text-align:center}
</style>

</head>
<body>

<main class="wrap">
<div class="narrow box" style="margin-top:50px"><section id="a1"><h1>Single sign-on</h1><div class="row"><label for="if-u">Corporate ID</label><input id="if-u" name="corp_id"></div><button type="button" id="if-1">Next</button></section>
  <section id="a2" hidden><h1>Password</h1><div class="row"><label for="if-p">Directory password</label><input id="if-p" name="dir_pass" type="password"></div><button type="button" id="if-2">Next</button></section>
  <section id="a3" hidden><h1>Authenticator code</h1><p>Open your authenticator app and type the six digits.</p><div class="digits" id="digits"><input id="if-d1" maxlength="1" inputmode="numeric" aria-label="Digit 1"><input id="if-d2" maxlength="1" inputmode="numeric" aria-label="Digit 2"><input id="if-d3" maxlength="1" inputmode="numeric" aria-label="Digit 3"><input id="if-d4" maxlength="1" inputmode="numeric" aria-label="Digit 4"><input id="if-d5" maxlength="1" inputmode="numeric" aria-label="Digit 5"><input id="if-d6" maxlength="1" inputmode="numeric" aria-label="Digit 6"></div></section></div>
</main>
<div class="legal-line">&copy; 2026 Ironfern Security, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#if-u"),"password":q("#if-p"),"otp":j(["#if-d1","#if-d2","#if-d3","#if-d4","#if-d5","#if-d6"])};}};</script>
<script>
function show(n){['a1','a2','a3'].forEach(function(id,i){document.getElementById(id).hidden=(i+1)!==n;});}
document.getElementById('if-1').addEventListener('click',function(){show(2);});document.getElementById('if-2').addEventListener('click',function(){show(3);});
var boxes=[].slice.call(document.querySelectorAll('#digits input'));boxes.forEach(function(b,i){b.addEventListener('input',function(){if(b.value&&boxes[i+1])boxes[i+1].focus();});});
</script>
</body>
</html>
