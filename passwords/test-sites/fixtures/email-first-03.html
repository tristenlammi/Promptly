<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostlery partner hub</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff8e8;--fg:#2e2410;--soft:#7a6a44;--line:#ecdcb4;--accent:#c97a06;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Trebuchet MS, Helvetica, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.util-strip{background:var(--fg);color:var(--bg);font-size:.8em;padding:4px 24px;display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap}.util-strip a{color:inherit}.brandbar{display:flex;align-items:center;gap:22px;padding:14px 24px;flex-wrap:wrap}.brandbar b{font-size:1.3em}.brandbar input{flex:1;min-width:180px}
.foot-cols{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px;padding:28px 32px;border-top:1px solid var(--line);font-size:.9em}.foot-cols h4{margin:0 0 6px}.foot-cols ul{list-style:none;padding:0;margin:0}

</style>

</head>
<body>
<div class="util-strip"><a href="#">Help</a><a href="#">Find a branch</a><a href="#">Careers</a><a href="#">Log in</a></div>
<header class="brandbar"><b>Ostlery Booking</b><input name="keywords" type="text" placeholder="What are you looking for?" aria-label="What are you looking for?"></header>
<main class="wrap">
<div class="narrow box" id="card"><h1>Partner hub</h1><div id="slot"><div class="row"><label for="partner-mail">Email</label><input type="email" id="partner-mail" name="partner_email"></div></div><button id="cont" type="button">Continue</button></div><p class="status-note muted" role="status">All systems normal. Scheduled maintenance this Sunday, 02:00 to 03:00 UTC.</p>
</main>
<footer class="foot-cols"><div><h4>Product</h4><ul><li><a href="#">Overview</a></li><li><a href="#">Security</a></li><li><a href="#">Changelog</a></li></ul></div><div><h4>Company</h4><ul><li><a href="#">About Ostlery Booking</a></li><li><a href="#">Press</a></li><li><a href="#">Careers</a></li></ul></div><div><h4>Legal</h4><ul><li><a href="#">Terms</a></li><li><a href="#">Privacy</a></li><li><a href="#">Cookies</a></li></ul></div></footer>


<script>
var S={username:'',password:''};var m=document.getElementById('partner-mail');m.addEventListener('input',function(){S.username=m.value;});
window.__fixture={state:function(){return S;}};
document.getElementById('cont').addEventListener('click',function(){var slot=document.getElementById('slot');slot.innerHTML='';var who=document.createElement('p');who.innerHTML='<b></b> <a href="#" id="change">Change</a>';who.querySelector('b').textContent=S.username;slot.appendChild(who);var r=document.createElement('div');r.className='row';r.innerHTML='<label for="partner-pass">Password</label><input type="password" id="partner-pass" name="partner_password">';slot.appendChild(r);var pw=r.querySelector('input');pw.addEventListener('input',function(){S.password=pw.value;});this.textContent='Sign in';this.id='signin-now';});
</script>
</body>
</html>
