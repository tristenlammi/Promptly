<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where should we send it?</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f1f5ef;--fg:#1d2a1f;--soft:#58695b;--line:#cdd9cc;--accent:#2f7a4a;--card:#fcfefb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Verdana, Geneva, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.shopbar{display:flex;gap:16px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:3px solid var(--accent);flex-wrap:wrap}.shopbar form{display:flex;flex:1;min-width:200px}.shopbar form input{flex:1;min-width:80px}.shopbar a{white-space:nowrap}
.foot{margin-top:40px;padding:28px 24px;background:var(--card);border-top:1px solid var(--line)}.foot .newsletter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.foot .newsletter label{font-weight:600;width:100%}.foot .newsletter input{flex:1;min-width:160px;max-width:320px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
</style>

</head>
<body>
<div class="shopbar"><strong>Mossgrove Outfitters</strong>
  <form onsubmit="return false" class="shop-search"><select name="dept" aria-label="Department"><option>All</option><option>Outdoors</option><option>Kitchen</option></select><input type="text" name="k" id="shop-k" placeholder="Search products"><button aria-label="Search">Search</button></form>
  <a href="#account">Account</a><a href="#orders">Orders</a><a href="#cart">Cart (0)</a></div>
<main class="wrap">
<form class="narrow box" onsubmit="return false"><h1>Delivery details</h1><div class="g2"><div class="row"><label for="ship-fn">First name</label><input id="ship-fn" name="first_name" autocomplete="given-name"></div><div class="row"><label for="ship-ln">Last name</label><input id="ship-ln" name="last_name" autocomplete="family-name"></div></div><div class="row"><label for="ship-a1">Address line 1</label><input id="ship-a1" name="address1" autocomplete="address-line1"></div><div class="row"><label for="ship-a2">Address line 2 (optional)</label><input id="ship-a2" name="address2" autocomplete="address-line2"></div><div class="g2"><div class="row"><label for="ship-city">City</label><input id="ship-city" name="city" autocomplete="address-level2"></div><div class="row"><label for="ship-st">State</label><input id="ship-st" name="state" autocomplete="address-level1"></div></div><div class="g2"><div class="row"><label for="ship-pc">Postcode</label><input id="ship-pc" name="zip" autocomplete="postal-code"></div><div class="row"><label for="ship-co">Country</label><select id="ship-co" name="country" autocomplete="country" style="width:100%"><option value="">Select</option><option value="AU">Australia</option><option value="NZ">New Zealand</option><option value="GB">United Kingdom</option><option value="US">United States</option></select></div></div><div class="row"><label for="ship-tel">Phone</label><input id="ship-tel" name="phone" type="tel" autocomplete="tel"></div><button>Continue to payment</button></form>
</main>
<footer class="foot"><form class="newsletter" action="#subscribe" onsubmit="return false">
  <label for="nl-email">Get the Mossgrove Outfitters newsletter</label>
  <input type="email" id="nl-email" name="email" placeholder="you@example.test" autocomplete="email"><button type="submit">Subscribe</button>
</form><p class="muted">&copy; 2026 Mossgrove Outfitters. Unsubscribe at any time.</p></footer>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"first-name":q("#ship-fn"),"last-name":q("#ship-ln"),"address1":q("#ship-a1"),"address2":q("#ship-a2"),"city":q("#ship-city"),"state":q("#ship-st"),"postcode":q("#ship-pc"),"country":q("#ship-co"),"phone":q("#ship-tel")};}};</script>

</body>
</html>
