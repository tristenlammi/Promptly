<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion à votre espace</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#faf7f2;--fg:#26221c;--soft:#6f675b;--line:#dcd4c6;--accent:#b4532a;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia, "Times New Roman", serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}


.t td{padding:6px}
</style>

</head>
<body>
<header style="display:flex;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center"><b>Maison Ormeraie</b><a href="#">Collections</a><a href="#">Boutiques</a><a href="#">Contact</a></header>
<main class="wrap">
<h1>Connexion à votre espace</h1><form onsubmit="return false"><table class="t"><tr><td><label for="identifiant">Adresse e-mail</label></td><td><input id="identifiant" name="identifiant" type="text"></td></tr><tr><td><label for="mdp">Mot de passe</label></td><td><input id="mdp" name="motdepasse" type="password"></td></tr><tr><td></td><td><button>Se connecter</button></td></tr></table></form><p><a href="#">Mot de passe oublié ?</a> &middot; <a href="#">Créer un compte</a></p>
</main>
<footer class="muted" style="padding:24px;text-align:center">Maison Ormeraie — Mentions légales — Politique de confidentialité</footer>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#identifiant"),"password":q("#mdp")};}};</script>

</body>
</html>
