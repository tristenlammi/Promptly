<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Sable Notes</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#eef1f5;--fg:#1b2430;--soft:#5a6778;--line:#cfd6df;--accent:#2c5fb3;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.navbar{display:flex;justify-content:space-between;padding:14px 28px;border-bottom:2px solid var(--line);flex-wrap:wrap;gap:10px}.navbar ul{list-style:none;display:flex;gap:18px;margin:0;padding:0;flex-wrap:wrap}.navbar .cta{background:var(--accent);color:#fff;padding:.3em .8em;border-radius:99px;text-decoration:none}
.lang-foot{display:flex;justify-content:space-between;padding:16px 28px;font-size:.85em;color:var(--soft);flex-wrap:wrap;gap:10px}
.form-floating{position:relative;margin-bottom:12px}.form-floating input{width:100%;padding:1.5em .75em .5em}.form-floating label{position:absolute;top:.3em;left:.8em;font-size:.75em;color:var(--soft)}.sso button{display:block;width:100%;margin-bottom:8px;background:var(--card);color:var(--fg);border:1px solid var(--line)}.or{text-align:center;color:var(--soft);margin:14px 0}
</style>

</head>
<body>
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="#"><strong>Sable Notes</strong></a>
  <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="#">Pricing</a></li><li class="nav-item"><a class="nav-link" href="#">Resources</a></li><li class="nav-item"><a class="nav-link" href="#">Support</a></li><li class="nav-item"><a class="nav-link" href="#signin">Sign in</a></li><li class="nav-item"><a class="cta" href="#signup">Get started</a></li></ul>
</nav>
<main class="wrap">
<div class="narrow box"><h1>Sign in</h1><div class="sso"><button type="button">Continue with work SSO</button><button type="button">Continue with a passkey</button></div><div class="or">or</div>
  <form onsubmit="return false"><div class="form-floating"><input class="form-control" id="floatingInput" name="session[email]" type="email" placeholder="name@example.test"><label for="floatingInput">Email address</label></div>
  <div class="form-floating"><input class="form-control" id="floatingPassword" name="session[password]" type="password" placeholder="Password"><label for="floatingPassword">Password</label></div>
  <button class="w-100" type="submit" style="width:100%">Sign in</button></form></div>
</main>
<div class="lang-foot"><select aria-label="Language" name="hl"><option>English (United States)</option><option>English (United Kingdom)</option><option>Espa&ntilde;ol</option></select><span><a href="#">Help</a> &nbsp; <a href="#">Privacy</a> &nbsp; <a href="#">Terms</a> &nbsp; Sable Notes</span></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#floatingInput"),"password":q("#floatingPassword")};}};</script>

</body>
</html>
