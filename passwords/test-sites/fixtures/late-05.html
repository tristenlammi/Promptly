<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvetine Cloud</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.navbar{display:flex;justify-content:space-between;padding:14px 28px;border-bottom:2px solid var(--line);flex-wrap:wrap;gap:10px}.navbar ul{list-style:none;display:flex;gap:18px;margin:0;padding:0;flex-wrap:wrap}.navbar .cta{background:var(--accent);color:#fff;padding:.3em .8em;border-radius:99px;text-decoration:none}
.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}

</style>

</head>
<body>
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="#"><strong>Velvetine Cloud</strong></a>
  <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="#">Pricing</a></li><li class="nav-item"><a class="nav-link" href="#">Resources</a></li><li class="nav-item"><a class="nav-link" href="#">Support</a></li><li class="nav-item"><a class="nav-link" href="#signin">Sign in</a></li><li class="nav-item"><a class="cta" href="#signup">Get started</a></li></ul>
</nav>
<main class="wrap">
<div id="outlet"><section><h1>Compute that stays out of your way</h1><p>Deploy from a folder. Scale when you need to.</p><p><a href="?view=login" id="nav-login">Log in</a> &middot; <a href="#">Pricing</a></p></section></div>
</main>
<div class="legal-line">&copy; 2026 Velvetine Cloud, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>


<script>
var S={username:'',password:''};window.__fixture={state:function(){return S;}};
function login(){document.title='Log in - Velvetine Cloud';document.getElementById('outlet').innerHTML='<div class="narrow box"><h1>Log in</h1><div class="row"><label for="rt-u">Email</label><input id="rt-u" type="email" name="email"></div><div class="row"><label for="rt-p">Password</label><input id="rt-p" type="password" name="password"></div><button type="button">Log in</button></div>';document.getElementById('rt-u').addEventListener('input',function(e){S.username=e.target.value;});document.getElementById('rt-p').addEventListener('input',function(e){S.password=e.target.value;});}
document.getElementById('nav-login').addEventListener('click',function(e){e.preventDefault();history.pushState({view:'login'},'','?view=login');setTimeout(login,250);});
</script>
</body>
</html>
