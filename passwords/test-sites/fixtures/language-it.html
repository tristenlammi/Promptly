<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea il tuo account</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff8e8;--fg:#2e2410;--soft:#7a6a44;--line:#ecdcb4;--accent:#c97a06;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Trebuchet MS, Helvetica, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}



</style>

</head>
<body>
<header style="display:flex;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center"><b>Ferramenta Lodola</b><a href="#">Catalogo</a><a href="#">Negozi</a><a href="#">Accedi</a></header>
<main class="wrap">
<form class="narrow box" onsubmit="return false"><h1>Crea il tuo account</h1><div class="row"><label for="nome">Nome</label><input id="nome" name="nome"></div><div class="row"><label for="cognome">Cognome</label><input id="cognome" name="cognome"></div><div class="row"><label for="posta">Indirizzo e-mail</label><input id="posta" name="posta_elettronica" type="email"></div><div class="row"><label for="pc1">Parola d'ordine</label><input id="pc1" name="parola_chiave" type="password"></div><div class="row"><label for="pc2">Conferma la parola d'ordine</label><input id="pc2" name="conferma_parola" type="password"></div><button>Registrati</button></form>
</main>
<footer class="muted" style="padding:24px;text-align:center">© 2026 Ferramenta Lodola. Tutti i diritti riservati.</footer>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"first-name":q("#nome"),"last-name":q("#cognome"),"username":q("#posta"),"new-password":q("#pc1"),"confirm-password":q("#pc2")};}};</script>

</body>
</html>
