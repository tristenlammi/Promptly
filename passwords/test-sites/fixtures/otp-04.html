<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste your code</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.bare-logo{padding:28px 0 0;text-align:center;font-size:1.5em;font-weight:700;letter-spacing:.02em}
.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}
.otp-row{display:flex;gap:8px;margin:14px 0}.otp-row input{width:44px;height:52px;text-align:center;font-size:1.3em;padding:0}
</style>

</head>
<body>
<div class="bare-logo">Ironfern Security</div>
<main class="wrap">
<div class="narrow box"><h1>Paste your code</h1><p>For your security this screen only accepts pasted codes. Copy the code from your authenticator.</p><div class="otp-row" id="pasteonly"><input id="po1" aria-label="Character 1" inputmode="numeric" maxlength="1" autocomplete="off"><input id="po2" aria-label="Character 2" inputmode="numeric" maxlength="1" autocomplete="off"><input id="po3" aria-label="Character 3" inputmode="numeric" maxlength="1" autocomplete="off"><input id="po4" aria-label="Character 4" inputmode="numeric" maxlength="1" autocomplete="off"><input id="po5" aria-label="Character 5" inputmode="numeric" maxlength="1" autocomplete="off"><input id="po6" aria-label="Character 6" inputmode="numeric" maxlength="1" autocomplete="off"></div><button type="button">Verify</button></div>
</main>
<div class="legal-line">&copy; 2026 Ironfern Security, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>


<script>
var code='';var B=[].slice.call(document.querySelectorAll('#pasteonly input'));B.forEach(function(b){b.addEventListener('beforeinput',function(e){if(e.inputType!=='insertFromPaste')e.preventDefault();});b.addEventListener('paste',function(e){e.preventDefault();var t=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);code=t;B.forEach(function(x,i){x.value=t.charAt(i);});});});window.__fixture={state:function(){return {otp:code};}};
</script>
</body>
</html>
