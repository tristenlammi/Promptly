<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in to Ombrelle</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#eef1f5;--fg:#1b2430;--soft:#5a6778;--line:#cfd6df;--accent:#2c5fb3;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.site-header{display:flex;gap:18px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}.site-header nav a{margin-right:14px;text-decoration:none}.site-header form{margin-left:auto;display:flex;gap:6px}.site-logo{font-weight:700;font-size:1.15em;text-decoration:none}
.app-strip{margin-top:40px;padding:20px 28px;background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.app-strip input{width:200px}
.pw-wrap{position:relative}.pw-wrap input{width:100%;padding-right:64px}.pw-toggle{position:absolute;right:4px;top:4px;background:none;color:var(--accent);padding:.2em .5em}
</style>

</head>
<body>
<header class="site-header">
  <a class="site-logo" href="#home">Ombrelle Travel</a>
  <nav aria-label="Main"><a href="#products">Products</a><a href="#pricing">Pricing</a><a href="#resources">Resources</a><a href="#support">Support</a></nav>
  <form role="search" action="#search" onsubmit="return false"><input type="search" name="q" id="site-search" placeholder="Search" aria-label="Search this site"><button type="submit">Go</button></form>
</header>
<main class="wrap">
<div class="split"><div class="box"><h1>Log in</h1><form onsubmit="return false" id="ombrelle-login">
    <div class="row"><label for="ol-email">Email or booking reference</label><input id="ol-email" name="login" type="text" autocomplete="username"></div>
    <div class="row"><label for="ol-pass">Password</label><div class="pw-wrap"><input id="ol-pass" name="password" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" id="pw-toggle" aria-pressed="false">Show</button></div></div>
    <button type="submit">Log in</button></form></div>
    <div><h2>Long weekends from 49</h2><p>Fly somewhere you cannot pronounce. Points on every booking and free changes up to a day before departure.</p></div></div>
</main>
<section class="app-strip" aria-label="Get the app"><strong>Get the Ombrelle Travel app.</strong> <span>We will text you a link.</span><input type="tel" id="app-link-phone" name="mobile" placeholder="Mobile number"><button type="button">Text me</button></section>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#ol-email"),"password":q("#ol-pass")};}};</script>
<script>
document.getElementById('pw-toggle').addEventListener('click',function(){var i=document.getElementById('ol-pass');var show=i.type==='password';i.type=show?'text':'password';this.textContent=show?'Hide':'Show';this.setAttribute('aria-pressed',String(show));});
</script>
</body>
</html>
