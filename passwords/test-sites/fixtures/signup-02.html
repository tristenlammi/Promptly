<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register at Ferncastle Forums</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#e8e8e0;--fg:#000000;--soft:#444444;--line:#999999;--accent:#000080;--card:#f4f4ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Tahoma, Verdana, Arial, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.masthead{width:100%;background:var(--accent);color:#fff;border-collapse:collapse}.masthead td{padding:6px 12px}.masthead a{color:#fff}.masthead input[name=s]{color:#000;background:#fff;width:120px}
.foot-table{width:100%;margin-top:30px;font-size:.8em;border-top:1px solid var(--line)}.foot-table td{padding:8px}
.reg td{padding:5px 8px}
</style>

</head>
<body>
<table class="masthead" width="100%" cellspacing="0" cellpadding="0"><tr>
  <td><font size="+1"><b>Ferncastle Forums</b></font></td>
  <td align="center"><a href="#">Home</a> | <a href="#">Services</a> | <a href="#">Contact us</a></td>
  <td align="right"><form name="sf" action="#find" onsubmit="return false"><input name="s" size="14"> <input type="submit" value="Find"></form></td>
</tr></table>
<main class="wrap">
<h2>Register an account</h2><form onsubmit="return false"><table class="reg" border="1" style="border-collapse:collapse;background:var(--card)"><tr><td>Choose a username:</td><td><input name="regusername" id="reg-u" size="24"></td></tr><tr><td>Email address:</td><td><input name="regemail" id="reg-e" size="24"></td></tr><tr><td>Password:</td><td><input name="regpass" id="reg-p" type="password" size="24"></td></tr><tr><td>Password (again):</td><td><input name="regpass2" id="reg-p2" type="password" size="24"></td></tr><tr><td>Time zone:</td><td><select name="tz"><option>GMT</option><option>GMT+1</option><option>GMT+10</option></select></td></tr><tr><td colspan="2"><label><input type="checkbox" name="rules"> I have read the forum rules</label></td></tr></table><p><input type="submit" value="Complete registration"></p></form>
</main>
<table class="foot-table"><tr><td>Ferncastle Forums Holdings. Member of the Fictional Deposit Scheme.</td><td align="right"><a href="#">Site map</a> | <a href="#">Disclosures</a> | <a href="#">Contact</a></td></tr></table>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#reg-u"),"email":q("#reg-e"),"new-password":q("#reg-p"),"confirm-password":q("#reg-p2")};}};</script>

</body>
</html>
