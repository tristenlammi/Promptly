<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhollow Studio</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f2fb;--fg:#241a33;--soft:#6a5c80;--line:#dcd2ea;--accent:#6b3fb5;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, Helvetica, Arial, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.topnav{display:flex;align-items:center;gap:20px;background:var(--accent);color:#fff;padding:10px 20px;flex-wrap:wrap}.topnav a{color:#fff;text-decoration:none}.topnav__brand{font-weight:700}.topnav__search{margin-left:auto}.topnav__input{border:0;width:220px;color:#222;background:#fff}
.footer__signup{margin-top:48px;padding:24px;background:var(--fg);color:var(--bg)}.footer__signup input{color:#222;background:#fff;margin-right:6px}.footer__signup span{display:block;margin-bottom:8px}
.collapse-x{max-height:0;overflow:hidden;transition:max-height .15s}.collapse-x.open{max-height:200px}
</style>

</head>
<body>
<div class="topnav">
  <a class="topnav__brand" href="#">Fernhollow Studio</a>
  <a class="topnav__link" href="#">Support</a>
  <a class="topnav__link" href="#">Company</a>
  <a class="topnav__link" href="#">Stories</a>
  <a class="topnav__link" href="#">Docs</a>
  <div class="topnav__search"><input id="hdr-query" class="topnav__input" type="text" placeholder="Search the help center" aria-label="Search"></div>
</div>
<main class="wrap">
<div class="narrow box" role="group" aria-label="Sign in"><h2>Sign in to your studio</h2>
  <div class="row"><input id="fh-id" type="text" placeholder="you@studio.example" aria-label="Email"></div>
  <div class="collapse-x" id="fh-more" aria-hidden="true"><div class="row"><input id="fh-pw" type="password" placeholder="Password" aria-label="Password" tabindex="-1"></div></div>
  <button id="fh-next" type="button" aria-expanded="false" aria-controls="fh-more">Next</button></div>
</main>
<div class="footer__signup"><span>Deals and updates from Fernhollow Studio, straight to your inbox.</span><input id="footer-email" type="text" name="EMAIL" placeholder="Email address"><button type="button">Sign me up</button><p class="muted">No spam. Privacy policy applies.</p></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#fh-id"),"password":q("#fh-pw")};}};</script>
<script>
document.getElementById('fh-next').addEventListener('click',function(){var m=document.getElementById('fh-more');m.addEventListener('transitionend',function(){m.setAttribute('data-settled','true');},{once:true});m.classList.add('open');m.setAttribute('aria-hidden','false');document.getElementById('fh-pw').removeAttribute('tabindex');this.setAttribute('aria-expanded','true');this.textContent='Sign in';document.getElementById('fh-id').readOnly=true;});
</script>
</body>
</html>
