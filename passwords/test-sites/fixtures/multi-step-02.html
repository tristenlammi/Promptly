<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to your account</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#eef1f5;--fg:#1b2430;--soft:#5a6778;--line:#cfd6df;--accent:#2c5fb3;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}

.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}
.panel{max-width:440px;margin:70px auto;background:var(--card);padding:40px;box-shadow:0 2px 12px rgba(0,0,0,.2)}.panel--off{display:none}.ident-banner{display:block;margin-bottom:10px}
</style>

</head>
<body>

<main class="wrap">
<div class="panel" id="p1"><h1>Sign in</h1><input id="login_identity" name="login_identity" type="email" placeholder="Email, phone, or username" style="width:100%" aria-required="true"><p class="muted">No account? <a href="#">Create one!</a></p><p><a href="#">Can&rsquo;t access your account?</a></p><button id="idSubmit" type="button">Next</button></div>
  <div class="panel panel--off" id="p2"><button class="linkbtn ident-banner" id="back" type="button">&larr; <span id="banner-who"></span></button><h1>Enter password</h1><input id="passwd" name="passwd" type="password" placeholder="Password" style="width:100%"><p><a href="#">Forgot my password</a></p><p><button type="button" class="linkbtn" id="not-you">Not you? Use another account</button></p><button id="pwSubmit" type="button">Sign in</button></div>
</main>
<div class="legal-line">&copy; 2026 Contessa Suite, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#login_identity"),"password":q("#passwd")};}};</script>
<script>
var a=document.getElementById('p1'),b=document.getElementById('p2');function sw(x){a.classList.toggle('panel--off',x);b.classList.toggle('panel--off',!x);}document.getElementById('idSubmit').addEventListener('click',function(){document.getElementById('banner-who').textContent=document.getElementById('login_identity').value;sw(true);});document.getElementById('back').addEventListener('click',function(){sw(false);});document.getElementById('not-you').addEventListener('click',function(){document.getElementById('login_identity').value='';sw(false);});
</script>
</body>
</html>
