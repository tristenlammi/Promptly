<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure checkout</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff8e8;--fg:#2e2410;--soft:#7a6a44;--line:#ecdcb4;--accent:#c97a06;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Trebuchet MS, Helvetica, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.shopbar{display:flex;gap:16px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:3px solid var(--accent);flex-wrap:wrap}.shopbar form{display:flex;flex:1;min-width:200px}.shopbar form input{flex:1;min-width:80px}.shopbar a{white-space:nowrap}
.foot{margin-top:40px;padding:28px 24px;background:var(--card);border-top:1px solid var(--line)}.foot .newsletter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.foot .newsletter label{font-weight:600;width:100%}.foot .newsletter input{flex:1;min-width:160px;max-width:320px}

</style>

</head>
<body>
<div class="shopbar"><strong>Wrenfield Home</strong>
  <form onsubmit="return false" class="shop-search"><select name="dept" aria-label="Department"><option>All</option><option>Outdoors</option><option>Kitchen</option></select><input type="text" name="k" id="shop-k" placeholder="Search products"><button aria-label="Search">Search</button></form>
  <a href="#account">Account</a><a href="#orders">Orders</a><a href="#cart">Cart (0)</a></div>
<main class="wrap">
<form class="narrow box" onsubmit="return false"><h1>Pay by card</h1><div class="row"><label for="ch">Cardholder</label><input id="ch" name="holder"></div><div class="row"><label for="pan">Card number</label><input id="pan" name="pan" maxlength="19"></div><div class="row"><span class="lbl">Expires</span><select id="exp-m" name="exp_month" aria-label="Expiry month"><option value="">Month</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select> <select id="exp-y" name="exp_year" aria-label="Expiry year"><option value="">Year</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option><option value="2031">2031</option></select></div><div class="row"><label for="cv">CVV</label><input id="cv" name="cvv" type="password" maxlength="4" style="width:90px"></div><div class="row"><label for="rcpt">Email for receipt</label><input id="rcpt" name="receipt_email" type="email"></div><button>Place order</button></form>
</main>
<footer class="foot"><form class="newsletter" action="#subscribe" onsubmit="return false">
  <label for="nl-email">Get the Wrenfield Home newsletter</label>
  <input type="email" id="nl-email" name="email" placeholder="you@example.test" autocomplete="email"><button type="submit">Subscribe</button>
</form><p class="muted">&copy; 2026 Wrenfield Home. Unsubscribe at any time.</p></footer>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"card-name":q("#ch"),"card-number":q("#pan"),"card-exp-month":q("#exp-m"),"card-exp-year":q("#exp-y"),"card-cvv":q("#cv")};}};</script>

</body>
</html>
