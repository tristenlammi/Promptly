<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay for your trip</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#ffffff;--fg:#222222;--soft:#666666;--line:#d8d8d8;--accent:#00587a;--card:#f7f9fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Arial, Helvetica, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.navbar{display:flex;justify-content:space-between;padding:14px 28px;border-bottom:2px solid var(--line);flex-wrap:wrap;gap:10px}.navbar ul{list-style:none;display:flex;gap:18px;margin:0;padding:0;flex-wrap:wrap}.navbar .cta{background:var(--accent);color:#fff;padding:.3em .8em;border-radius:99px;text-decoration:none}
.foot-cols{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px;padding:28px 32px;border-top:1px solid var(--line);font-size:.9em}.foot-cols h4{margin:0 0 6px}.foot-cols ul{list-style:none;padding:0;margin:0}
.pay td{padding:6px 6px 6px 0}
</style>

</head>
<body>
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="#"><strong>Ombrelle Travel</strong></a>
  <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="#">Pricing</a></li><li class="nav-item"><a class="nav-link" href="#">Resources</a></li><li class="nav-item"><a class="nav-link" href="#">Support</a></li><li class="nav-item"><a class="nav-link" href="#signin">Sign in</a></li><li class="nav-item"><a class="cta" href="#signup">Get started</a></li></ul>
</nav>
<main class="wrap">
<h1>Pay for your trip</h1><form onsubmit="return false"><table class="pay"><tr><td><label for="m-num">Card number</label></td><td><input id="m-num" name="card_no" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" style="width:220px"></td></tr><tr><td><label for="m-exp">Valid until</label></td><td><input id="m-exp" name="valid_until" placeholder="MM / YY" maxlength="7" inputmode="numeric"></td></tr><tr><td><label for="m-sec">CVC</label></td><td><input id="m-sec" name="csc" maxlength="3" inputmode="numeric" style="width:70px"></td></tr><tr><td><label for="m-name">Name as on card</label></td><td><input id="m-name" name="nameoncard"></td></tr></table><p><button>Pay now</button></p></form>
</main>
<footer class="foot-cols"><div><h4>Product</h4><ul><li><a href="#">Overview</a></li><li><a href="#">Security</a></li><li><a href="#">Changelog</a></li></ul></div><div><h4>Company</h4><ul><li><a href="#">About Ombrelle Travel</a></li><li><a href="#">Press</a></li><li><a href="#">Careers</a></li></ul></div><div><h4>Legal</h4><ul><li><a href="#">Terms</a></li><li><a href="#">Privacy</a></li><li><a href="#">Cookies</a></li></ul></div></footer>


<script>
var M={num:'',exp:'',cvc:'',name:''};var n=document.getElementById('m-num'),e=document.getElementById('m-exp'),c=document.getElementById('m-sec'),a=document.getElementById('m-name');
n.addEventListener('input',function(){M.num=n.value.replace(/[^0-9]/g,'').slice(0,16);n.value=M.num.replace(/(.{4})(?=.)/g,'$1 ');});
e.addEventListener('input',function(){var d=e.value.replace(/[^0-9]/g,'').slice(0,4);M.exp=d;e.value=d.length>2?d.slice(0,2)+' / '+d.slice(2):d;});
c.addEventListener('input',function(){M.cvc=c.value;});a.addEventListener('input',function(){M.name=a.value;});
window.__fixture={state:function(){return {'card-number':M.num,'card-exp':M.exp,'card-cvv':M.cvc,'card-name':M.name};}};
</script>
</body>
</html>
