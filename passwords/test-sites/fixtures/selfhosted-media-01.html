<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reelhouse</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14171f;--fg:#e6e8ee;--soft:#9aa2b2;--line:#2c3240;--accent:#7c9cff;--card:#1c2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}


.rh{max-width:620px;margin:60px auto;text-align:center}.rh-cards{display:flex;gap:18px;justify-content:center;margin:24px 0}.rh-card{width:120px;background:#2a2f3c;border-radius:6px;padding:10px;color:var(--fg)}.rh-av{height:90px;background:#3b4256;border-radius:4px;margin-bottom:6px}
.rh-btn{display:block;width:280px;margin:8px auto;background:#3b4256}.rh-form{width:320px;margin:0 auto;text-align:left}.rh-form label{display:block;margin:12px 0 4px}.rh-form input[type=text],.rh-form input[type=password]{width:100%}
</style>

</head>
<body>

<div class="rh"><h1>Please sign in</h1><div id="rh-pick"><div class="rh-cards"><button type="button" class="rh-card"><div class="rh-av"></div>Mara</button><button type="button" class="rh-card"><div class="rh-av"></div>Theo</button></div>
<button type="button" class="rh-btn" id="rh-manual">Manual Login</button><button type="button" class="rh-btn">Quick Connect</button><button type="button" class="rh-btn">Forgot Password</button></div>
<form class="rh-form" id="rh-login" hidden onsubmit="return false"><label for="txtManualName">User:</label><input type="text" id="txtManualName" autocomplete="username" autocapitalize="off" required>
<label for="txtManualPassword">Password:</label><input type="password" id="txtManualPassword" autocomplete="current-password">
<label style="font-weight:400"><input type="checkbox" id="chkRememberLogin" checked> Remember me</label><button type="submit" class="rh-btn">Sign In</button><button type="button" class="rh-btn" id="rh-cancel">Cancel</button></form></div>


<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"username":q("#txtManualName"),"password":q("#txtManualPassword")};}};</script>
<script>
document.getElementById('rh-manual').onclick=function(){document.getElementById('rh-pick').hidden=true;document.getElementById('rh-login').hidden=false;document.getElementById('txtManualName').focus();};
document.getElementById('rh-cancel').onclick=function(){document.getElementById('rh-pick').hidden=false;document.getElementById('rh-login').hidden=true;};
</script>
</body>
</html>
