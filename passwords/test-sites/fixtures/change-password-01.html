<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security settings - Acme Ledger</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#eef1f5;--fg:#1b2430;--soft:#5a6778;--line:#cfd6df;--accent:#2c5fb3;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.site-header{display:flex;gap:18px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}.site-header nav a{margin-right:14px;text-decoration:none}.site-header form{margin-left:auto;display:flex;gap:6px}.site-logo{font-weight:700;font-size:1.15em;text-decoration:none}
.legal-line{text-align:center;padding:30px 12px;font-size:.8em;color:var(--soft)}
.settings{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px}.settings ul{list-style:none;padding:0}@media(max-width:640px){.settings{grid-template-columns:minmax(0,1fr)}}
</style>

</head>
<body>
<header class="site-header">
  <a class="site-logo" href="#home">Acme Ledger</a>
  <nav aria-label="Main"><a href="#products">Products</a><a href="#pricing">Pricing</a><a href="#resources">Resources</a><a href="#support">Support</a></nav>
  <form role="search" action="#search" onsubmit="return false"><input type="search" name="q" id="site-search" placeholder="Search" aria-label="Search this site"><button type="submit">Go</button></form>
</header>
<main class="wrap">
<div class="settings"><nav aria-label="Settings"><ul><li><a href="#">Profile</a></li><li><a href="#"><b>Security</b></a></li><li><a href="#">Billing</a></li><li><a href="#">Notifications</a></li></ul></nav><form class="box" onsubmit="return false"><h1>Change password</h1><div class="row"><label for="cur">Current password</label><input id="cur" name="current_password" type="password" autocomplete="current-password"></div><div class="row"><label for="nw">New password</label><input id="nw" name="new_password" type="password" autocomplete="new-password"></div><div class="row"><label for="cf">Confirm new password</label><input id="cf" name="confirm_password" type="password" autocomplete="new-password"></div><button>Update password</button></form></div>
</main>
<div class="legal-line">&copy; 2026 Acme Ledger, all rights reserved &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a> &middot; <a href="#">Accessibility</a></div>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"current-password":q("#cur"),"new-password":q("#nw"),"confirm-password":q("#cf")};}};</script>

</body>
</html>
