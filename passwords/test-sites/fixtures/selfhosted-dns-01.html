<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinkhole Admin Console</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f1f5ef;--fg:#1d2a1f;--soft:#58695b;--line:#cdd9cc;--accent:#2f7a4a;--card:#fcfefb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Verdana, Geneva, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}


.sk{display:flex;min-height:100vh}.sk-side{width:220px;background:#1f2d24;color:#cfe;padding:16px}.sk-side a{display:block;color:#cfe;margin:8px 0}.sk-main{flex:1;padding:40px}.sk-box{max-width:420px;margin:0 auto;background:var(--card);border-top:3px solid var(--accent);padding:24px}.sk-box input[type=password]{width:100%}
</style>

</head>
<body>

<div class="sk"><nav class="sk-side"><b>Sinkhole</b><a href="#">Dashboard</a><a href="#">Query Log</a><a href="#">Groups</a><a href="#">Adlists</a><a href="#">Settings</a><a href="#">Donate</a></nav>
<main class="sk-main"><div class="sk-box"><h3>Login</h3><p class="muted">Sign in to see query statistics and change settings.</p><form action="#" id="loginform" method="post" onsubmit="return false">
<div class="row"><input type="password" id="loginpw" name="pw" class="form-control" placeholder="Password" autocomplete="current-password" autofocus></div>
<label style="font-weight:400"><input type="checkbox" id="logincookie" name="persistentlogin"> Remember me for 7 days</label><p><button type="submit" class="btn">Log in</button></p></form></div></main></div>


<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"password":q("#loginpw")};}};</script>

</body>
</html>
