<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm it is you</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f2fb;--fg:#241a33;--soft:#6a5c80;--line:#dcd2ea;--accent:#6b3fb5;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui, Helvetica, Arial, sans-serif}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.45em .6em;max-width:100%}
button,input[type=submit],input[type=button]{font:inherit;cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:.5em 1em}
button[disabled],input[disabled]{opacity:.5;cursor:not-allowed}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.narrow{max-width:420px;margin:0 auto}
.row{margin:0 0 14px}
.row label,.lbl{display:block;font-weight:600;margin-bottom:4px}
.row input:not([type=checkbox]):not([type=radio]){width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--soft);font-size:.9em}
.linkbtn{background:none;color:var(--accent);padding:0;text-decoration:underline}
.bare-logo{padding:28px 0 0;text-align:center;font-size:1.5em;font-weight:700;letter-spacing:.02em}
.foot{margin-top:40px;padding:28px 24px;background:var(--card);border-top:1px solid var(--line)}.foot .newsletter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.foot .newsletter label{font-weight:600;width:100%}.foot .newsletter input{flex:1;min-width:160px;max-width:320px}
.otp-row{display:flex;gap:8px;margin:14px 0}.otp-row input{width:44px;height:52px;text-align:center;font-size:1.3em;padding:0}
</style>

</head>
<body>
<div class="bare-logo">Dappermint Pay</div>
<main class="wrap">
<div class="narrow box"><h1>Confirm it&rsquo;s you</h1><p id="desc">Type the code we just texted you.</p><div class="otp-row" role="group" aria-labelledby="desc"><input id="sx1" type="text" inputmode="numeric" maxlength="1"><input id="sx2" type="text" inputmode="numeric" maxlength="1"><input id="sx3" type="text" inputmode="numeric" maxlength="1"><input id="sx4" type="text" inputmode="numeric" maxlength="1"><input id="sx5" type="text" inputmode="numeric" maxlength="1"><input id="sx6" type="text" inputmode="numeric" maxlength="1"></div><button type="button">Confirm</button></div>
</main>
<footer class="foot"><form class="newsletter" action="#subscribe" onsubmit="return false">
  <label for="nl-email">Get the Dappermint Pay newsletter</label>
  <input type="email" id="nl-email" name="email" placeholder="you@example.test" autocomplete="email"><button type="submit">Subscribe</button>
</form><p class="muted">&copy; 2026 Dappermint Pay. Unsubscribe at any time.</p></footer>

<script>window.__fixture={state:function(){var q=function(s){var e=document.querySelector(s);return e?e.value:'';};var j=function(a){return a.map(q).join('');};return {"otp":j(["#sx1","#sx2","#sx3","#sx4","#sx5","#sx6"])};}};</script>
<script>
(function(){var b=[].slice.call(document.querySelectorAll(".otp-row input"));b.forEach(function(x,i){x.addEventListener('input',function(){x.value=x.value.replace(/[^0-9]/g,'').slice(-1);if(x.value&&b[i+1])b[i+1].focus();});x.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!x.value&&b[i-1])b[i-1].focus();});x.addEventListener('paste',function(e){var t=(e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'');if(!t)return;e.preventDefault();t.split('').forEach(function(c,k){if(b[k])b[k].value=c;});});});})();
</script>
</body>
</html>
