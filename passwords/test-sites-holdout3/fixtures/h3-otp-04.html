<body>
<div class="wrap"><h1>Verify your number</h1><p>Enter the 4-digit code we sent by SMS.</p><form onsubmit="return false"><div class="pin-row" role="group" aria-label="4-digit SMS code"><input name="d1" type="tel" maxlength="1" autocomplete="off"><input name="d2" type="tel" maxlength="1" autocomplete="off"><input name="d3" type="tel" maxlength="1" autocomplete="off"><input name="d4" type="tel" maxlength="1" autocomplete="off"></div><button type="submit">Verify</button></form></div>
