<style>
*{box-sizing:border-box}[hidden]{display:none!important}input[type=checkbox],input[type=radio]{width:auto}

<body>
<div class="card"><h1>Sign in</h1><p>to continue to Pinegrove Mail</p><div id="pane"><div class="field"><label for="identifier">Email address</label><input id="identifier" name="identifier" type="email" autocomplete="username"></div><button class="next" id="next" type="button">Next</button></div></div>

return {"email":(document.getElementById('identifier')?document.getElementById('identifier').value:window.__email),"password":r("#secret",[])};}};</script>
<script>var who=document.getElementById('identifier');window.__email='';who.addEventListener('input',function(){window.__email=who.value});document.getElementById('next').onclick=function(){window.__email=who.value;var c=document.createElement('div');c.className='chip';c.textContent=who.value||'your account';var pane=document.getElementById('pane');pane.innerHTML='<div class="field"><label for="secret">Enter your password</label><input id="secret" name="secret" type="password" autocomplete="current-password"></div><button class="next" type="button">Sign in</button>';pane.insertBefore(c,pane.firstChild);};</script>
