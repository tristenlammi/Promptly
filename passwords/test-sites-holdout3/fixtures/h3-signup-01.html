<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account - Larkspur Learning</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}input[type=checkbox],input[type=radio]{width:auto}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;color:#111827;background:#f9fafb}a{color:#4f46e5;text-decoration:none}h2{font-size:24px;line-height:36px;margin:0 0 24px;font-weight:700}
header{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:#fff;border-bottom:1px solid #e5e7eb}header form{margin-left:auto}header input{width:224px}

</style>
</head>
<body>
<main class="mx-auto max-w-md py-12"><h2 class="text-2xl/9 font-bold">Create your account</h2><form class="mt-8 space-y-6 rowgap" onsubmit="return false"><div class="grid grid-cols-2 gap-4" style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label for="first-name" class="block text-sm/6 font-medium">First name</label><input id="first-name" name="first-name" type="text" autocomplete="given-name" class="mt-2 block w-full rounded-md"></div><div><label for="last-name" class="block text-sm/6 font-medium">Last name</label><input id="last-name" name="last-name" type="text" autocomplete="family-name" class="mt-2 block w-full rounded-md"></div></div><div><label for="email" class="block text-sm/6 font-medium">Email</label><input id="email" name="email" type="email" autocomplete="email" class="mt-2 block w-full rounded-md"></div><div><label for="password" class="block text-sm/6 font-medium">Password</label><input id="password" name="password" type="password" autocomplete="new-password" class="mt-2 block w-full rounded-md"></div><div><label for="password-confirm" class="block text-sm/6 font-medium">Confirm password</label><input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" class="mt-2 block w-full rounded-md"></div><label class="flex gap-2 text-sm"><input type="checkbox" required> I agree to the terms</label><button class="w-full rounded-md" type="submit">Sign up</button></form><p class="mt-6 text-sm">Already enrolled? <a href="#">Log in</a></p></main><footer><span>Course news in your inbox</span><form onsubmit="return false"><input id="footer-nl" type="email" name="news" placeholder="Email address"><button type="submit">Go</button></form></footer>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}

return {"first-name":r("#first-name",[]),"last-name":r("#last-name",[]),"email":r("#email",[]),"new-password":r("#password",[]),"confirm-password":r("#password-confirm",[])};}};</script>
</body>
</html>
