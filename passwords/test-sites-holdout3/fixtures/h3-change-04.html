<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security settings - Tallgrass CRM</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}input[type=checkbox],input[type=radio]{width:auto}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;background:#f7fafc;color:#1a202c}.css-wrap{max-width:36rem;margin:3rem auto}.chakra-accordion__item{background:#fff;border:1px solid #e2e8f0;border-radius:.5rem;margin-bottom:.75rem}.chakra-accordion__button{width:100%;text-align:left;padding:.75rem 1rem;background:none;border:0;font:inherit;font-weight:600;cursor:pointer}.chakra-accordion__panel{padding:0 1rem 1rem}.chakra-form__label{display:block;font-size:.875rem;margin:.5rem 0 .25rem}.chakra-input{width:100%;height:2.5rem;padding:0 .75rem;border:1px solid #cbd5e0;border-radius:.375rem;font:inherit}.chakra-button{margin-top:.75rem;padding:.5rem 1rem;background:#2b6cb0;color:#fff;border:0;border-radius:.375rem;cursor:pointer;font:inherit}
</style>
</head>
<body>
<div class="css-wrap"><h1 class="chakra-heading">Security</h1><div class="chakra-accordion"><div class="chakra-accordion__item"><h2><button class="chakra-accordion__button" type="button">Account recovery</button></h2><div class="chakra-accordion__panel"><label class="chakra-form__label" for="recovery-email">Recovery email</label><input class="chakra-input" id="recovery-email" type="email"></div></div><div class="chakra-accordion__item"><h2><button class="chakra-accordion__button" id="pw-toggle" type="button" aria-expanded="false">Password</button></h2><div class="chakra-accordion__panel" id="pw-panel" hidden></div></div></div></div><template id="tpl"><form onsubmit="return false"><label class="chakra-form__label" for="cp-current">Current password</label><input class="chakra-input" id="cp-current" type="password"><label class="chakra-form__label" for="cp-new">New password</label><input class="chakra-input" id="cp-new" type="password"><label class="chakra-form__label" for="cp-repeat">Repeat new password</label><input class="chakra-input" id="cp-repeat" type="password"><button class="chakra-button" type="submit">Change password</button></form></template>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"current-password":r("#cp-current",[]),"new-password":r("#cp-new",[]),"confirm-password":r("#cp-repeat",[])};}};</script>
<script>document.getElementById('pw-toggle').onclick=function(){var p=document.getElementById('pw-panel');p.hidden=false;this.setAttribute('aria-expanded','true');if(p.firstChild)return;p.textContent='Loading...';setTimeout(function(){p.textContent='';p.appendChild(document.getElementById('tpl').content.cloneNode(true));},600);};</script>
</body>
</html>
