<title>เข้าสู่ระบบ - ร้านบ้านสวน</title>

<style>
*{box-sizing:border-box}[hidden]{display:none!important}input[type=checkbox],input[type=radio]{width:auto}
body{margin:0;font:15px/1.6 "Noto Sans",system-ui,sans-serif;background:#f5f7f4;color:#1d2a22}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#1d5c43;color:#fff}.bar input{padding:4px 8px;border:0;border-radius:4px;font:inherit}.box{max-width:400px;margin:56px auto;background:#fff;border-radius:10px;padding:28px;border:1px solid #dfe5de}.box label{display:block;font-size:13px;margin-bottom:3px}.box .i{width:100%;padding:9px;border:1px solid #b5bfb6;border-radius:6px;font:inherit;margin-bottom:14px}.go{width:100%;padding:10px;border:0;border-radius:6px;background:#1d5c43;color:#fff;font:inherit;cursor:pointer}.foot{max-width:400px;margin:0 auto;display:flex;gap:8px;align-items:center;font-size:13px}.foot input{flex:1;padding:6px;border:1px solid #b5bfb6;border-radius:4px;font:inherit}
</style>
</head>
<body>
<div class="box login-box"><h1>เข้าสู่ระบบ</h1><form onsubmit="return false"><input class="i" type="text" placeholder="ชื่อผู้ใช้"><input class="i" type="password" placeholder="รหัสผ่าน"><button class="go" type="submit">เข้าสู่ระบบ</button></form><p><a href="#">ลืมรหัสผ่าน?</a></p></div><div class="foot"><span>รับข่าวสารทางอีเมล</span><input id="news" type="email" placeholder="อีเมลของคุณ"></div>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"username":r(".login-box input[type=\"text\"]",[]),"password":r(".login-box input[type=\"password\"]",[])};}};</script>
