<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Mosswell Tea</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}input[type=checkbox],input[type=radio]{width:auto}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;color:#111827;background:#f9fafb}a{color:#4f46e5;text-decoration:none}label{display:block;font-weight:500;margin-bottom:6px}input,select,textarea{width:100%;font:inherit;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff}button{font:inherit;font-weight:600;padding:7px 12px;border:0;border-radius:6px;background:#4f46e5;color:#fff;cursor:pointer}main{max-width:760px;margin:32px auto;display:grid;grid-template-columns:1fr 280px;gap:32px;padding:0 16px}.f{margin-bottom:14px}.pair{display:flex;gap:12px}.pair>div{flex:1}aside{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px}
</style>
</head>
<body>
<main class="mx-auto grid max-w-3xl gap-8 lg:grid-cols-3"><div class="lg:col-span-2"><h1 class="text-xl font-semibold">Payment</h1><form onsubmit="return false"><div class="f"><label for="cc-name" class="text-sm/6 font-medium">Name on card</label><input id="cc-name" name="ccname" autocomplete="cc-name" class="block w-full rounded-md" type="text"></div><div class="f"><label for="cc-number" class="text-sm/6 font-medium">Card number</label><input id="cc-number" name="cardnumber" autocomplete="cc-number" inputmode="numeric" maxlength="19" placeholder="1234 1234 1234 1234" class="block w-full rounded-md" type="text"></div><div class="pair flex gap-3"><div class="f"><label for="cc-exp" class="text-sm/6 font-medium">Expiry (MM/YY)</label><input id="cc-exp" name="exp-date" autocomplete="cc-exp" inputmode="numeric" maxlength="5" placeholder="MM/YY" class="block w-full rounded-md" type="text"></div><div class="f"><label for="cc-csc" class="text-sm/6 font-medium">CVC</label><input id="cc-csc" name="cvc" autocomplete="cc-csc" inputmode="numeric" maxlength="4" class="block w-full rounded-md" type="text"></div></div><button class="w-full rounded-md" type="submit">Pay $38.00</button></form></div><aside class="rounded-xl border p-4"><h2>Order</h2><p>Smoked oolong, 2 tins</p><label for="promo" class="text-sm/6">Promo code</label><input id="promo" name="promo" type="text"><label for="order-note" style="margin-top:10px" class="text-sm/6">Note for the packer</label><textarea id="order-note" name="note" rows="2"></textarea></aside></main>
<script>window.__fixture={state:function(){function r(sel,frames){var d=document,i;for(i=0;i<frames.length;i++){var fe=d.querySelector(frames[i]);if(!fe||!fe.contentDocument)return '';d=fe.contentDocument;}
var n;if(Array.isArray(sel)){n=null;var root=d;for(i=0;i<sel.length;i++){n=root&&root.querySelector(sel[i]);if(!n)return '';root=n.shadowRoot;}}else{n=d.querySelector(sel);}return n?n.value:'';}
return {"card-name":r("#cc-name",[]),"card-number":r("#cc-number",[]),"card-exp":r("#cc-exp",[]),"card-cvv":r("#cc-csc",[])};}};</script>
<script>var num=document.getElementById('cc-number'),ex=document.getElementById('cc-exp');num.addEventListener('input',function(){num.value=num.value.replace(/[^0-9]/g,'').slice(0,16).replace(/(.{4})(?=.)/g,'$1 ');});ex.addEventListener('input',function(){var d=ex.value.replace(/[^0-9]/g,'').slice(0,4);ex.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;});</script>
</body>
</html>
