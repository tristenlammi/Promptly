# Isolated stack for the `passwords` branch: its own project, containers,
# volumes, images and port (:8092), so branch migrations never touch the main
# dev database. Secrets come from passwords/stack/.env (generated by up.sh,
# gitignored), never from the repo's real .env.
#
#   bash passwords/stack/up.sh            build frontend/dist, start everything
#   docker compose -f passwords/stack/docker-compose.yml --env-file passwords/stack/.env ps
#
# backend/app and backend/alembic are bind-mounted, so a code change only needs
# `restart backend arq-worker mail-worker`, not an image build.
name: promptly-pw

x-backend-env: &backend-env
  - DATABASE_URL=postgresql+asyncpg://promptly:${POSTGRES_PASSWORD}@postgres:5432/promptly
  - REDIS_URL=redis://redis:6379/0
  - SECRET_KEY=${SECRET_KEY}
  - COLLAB_INTERNAL_TOKEN=
  - TUS_ENABLED=false
  - SINGLE_USER_MODE=false
  - SEARXNG_ENABLED=false
  - OLLAMA_URL=http://127.0.0.1:9
  - CODE_SANDBOX_URL=http://sandbox:8000
  - CODE_SANDBOX_SECRET=${SECRET_KEY}
  - WHISPER_URL=http://127.0.0.1:9
  - TTS_URL=http://127.0.0.1:9
  - CONVERT_URL=
  - WYOMING_ENABLED=false
  - COOKIE_SECURE=false
  - RATE_LIMIT_ENABLED=true
  - PASSWORDS_E2E=${PASSWORDS_E2E:-0}

x-backend-vols: &backend-vols
  - ../../backend/app:/app/app
  - ../../backend/alembic:/app/alembic
  - pw_uploads:/app/uploads
  - pw_whiteboard:/app/whiteboard
  - pw_backups:/app/backups
  - pw_offsite:/app/offsite

services:
  nginx:
    image: nginx:1.31-alpine
    container_name: PromptlyPw-Nginx
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/promptly:/etc/nginx/promptly:ro
      - pw_uploads:/srv/promptly-uploads:ro
    depends_on: [frontend, backend, collab]
    restart: unless-stopped
    networks: [pw]

  frontend:
    # The built SPA from the worktree (npm run build), so a rebuild is local.
    # Same nginx.spa.conf the real image uses.
    image: nginx:alpine
    container_name: PromptlyPw-Frontend
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ../../frontend/nginx.spa.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks: [pw]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    image: promptly-pw-backend:local
    pull_policy: never
    container_name: PromptlyPw-Backend
    environment: *backend-env
    volumes: *backend-vols
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [pw]

  arq-worker:
    image: promptly-pw-backend:local
    pull_policy: never
    container_name: PromptlyPw-ArqWorker
    entrypoint: ["arq", "app.tasks.worker.WorkerSettings"]
    environment: *backend-env
    volumes: *backend-vols
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    networks: [pw]

  mail-worker:
    image: promptly-pw-backend:local
    pull_policy: never
    container_name: PromptlyPw-MailWorker
    entrypoint: ["python", "-m", "app.mail.worker"]
    environment: *backend-env
    volumes: *backend-vols
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    networks: [pw]

  collab:
    build:
      context: ../../collab
      dockerfile: Dockerfile
    image: promptly-pw-collab:local
    pull_policy: never
    container_name: PromptlyPw-Collab
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - COLLAB_INTERNAL_TOKEN=
      - DATABASE_URL=postgresql://promptly:${POSTGRES_PASSWORD}@postgres:5432/promptly
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    networks: [pw]

  postgres:
    image: pgvector/pgvector:pg15
    container_name: PromptlyPw-Postgres
    environment:
      - POSTGRES_USER=promptly
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=promptly
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - pw_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptly -d promptly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [pw]

  redis:
    image: redis:7.4-alpine
    container_name: PromptlyPw-Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [pw]

networks:
  pw:
    name: promptly-pw

volumes:
  pw_postgres:
  pw_uploads:
  pw_whiteboard:
  pw_backups:
  pw_offsite:
