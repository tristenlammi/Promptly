# The Xcode project, as text. `xcodegen generate` (run by CI on a Mac) turns
# this into Promptly.xcodeproj, so nothing binary is edited or kept in git.
name: Promptly
options:
  bundleIdPrefix: org.promptly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Deployment.xcconfig
  Release: Config/Deployment.xcconfig
packages:
  PromptlyCore:
    path: PromptlyCore
targets:
  Promptly:
    type: application
    platform: iOS
    sources:
      - path: Promptly
    dependencies:
      - package: PromptlyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PROMPTLY_BUNDLE_ID)
        PRODUCT_NAME: Promptly
        INFOPLIST_FILE: Promptly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: $(PROMPTLY_VERSION)
        CURRENT_PROJECT_VERSION: $(PROMPTLY_BUILD)
        DEVELOPMENT_TEAM: $(PROMPTLY_TEAM_ID)
        CODE_SIGN_ENTITLEMENTS: $(PROMPTLY_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Promptly:
    build:
      targets:
        Promptly: all
    run:
      config: Debug
    archive:
      config: Release
