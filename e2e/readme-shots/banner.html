<!doctype html>
<!-- The README banner (docs/screenshots/readme-banner.png), 1280 x 300.
     Retake it with:  cd e2e && node tools-readme-shots.mjs banner
     The tagline is the one line to change. The logo is the app's own
     (frontend/public/promptly-icon.svg) and the font is the app's DM Sans
     (the frontend's @fontsource package: run `npm ci` in frontend/ first,
     or the system sans-serif is used instead). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Promptly banner</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        font-weight: 400;
        src: url("../../frontend/node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "DM Sans";
        font-weight: 700;
        src: url("../../frontend/node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 300px;
        overflow: hidden;
        font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(420px 300px at 155px 150px, rgba(217, 119, 87, 0.2), rgba(217, 119, 87, 0) 70%),
          linear-gradient(100deg, #33271f 0%, #2a211d 30%, #231d1b 62%, #1f1b1a 100%);
      }
      .logo {
        position: absolute;
        left: 85px;
        top: 80px;
        width: 140px;
        height: 140px;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(217, 119, 87, 0.22);
      }
      .logo img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The soft light from the top left, as on the app icon. */
      .logo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0) 75%);
        mix-blend-mode: screen;
      }
      .name {
        position: absolute;
        left: 271px;
        top: 96px;
        margin: 0;
        font-size: 76px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -1px;
        color: #f6f2ee;
      }
      .tagline {
        position: absolute;
        left: 273px;
        top: 184px;
        margin: 0;
        font-size: 27px;
        line-height: 1.3;
        font-weight: 400;
        color: #a59c94;
      }
      .site {
        position: absolute;
        right: 109px;
        top: 238px;
        margin: 0;
        font-size: 27px;
        line-height: 1.3;
        font-weight: 400;
        color: #dd8563;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: linear-gradient(90deg, rgba(217, 119, 87, 0.25), rgba(217, 119, 87, 0.75) 50%, rgba(217, 119, 87, 0.25));
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="logo"><img src="../../frontend/public/promptly-icon.svg" alt="" /></div>
      <h1 class="name">Promptly</h1>
      <p class="tagline">Your self-hosted suite for home and family.</p>
      <p class="site">chatpromptly.com</p>
      <div class="line"></div>
    </div>
  </body>
</html>
