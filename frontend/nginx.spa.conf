server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip is configured in the main nginx container; keep this server simple.

    # The service worker's scope is the directory it's served from. We
    # ship sw.js at the root and want it controlling the whole origin,
    # so make sure it's served fresh — never cache the SW itself, or
    # users get stuck on stale builds even after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    # PWA manifest: nginx's stock mime.types doesn't know about
    # .webmanifest. Override the default_type just inside this
    # location so the inherited mappings (`.js`, `.css`, `.png`, …)
    # stay intact for every other request.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA fallback — every unmatched route returns index.html so React Router
    # can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell. index.html embeds the hashed chunk filenames
    # for the current build, so a stale copy after a redeploy makes the page
    # request chunks that no longer exist (404 → "Failed to fetch dynamically
    # imported module"). try_files' fallback to /index.html re-enters location
    # matching, so this also covers every SPA route. The hashed assets under
    # /assets/ stay immutable-cached below.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Long-cache hashed static assets produced by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's stock mime.types maps `.js` but not `.mjs`, so a module
    # emitted with that extension — pdf.js ships its worker as
    # `pdf.worker.min-<hash>.mjs` — was served as the default
    # `application/octet-stream`. Browsers enforce strict MIME checking on
    # ES modules and refuse to execute one that isn't a JavaScript type,
    # which surfaces as "Failed to fetch dynamically imported module": a
    # misleading message, since the fetch itself returns 200.
    #
    # Same class of gap as the `.webmanifest` override above, and handled
    # the same way — a `types` block here would REPLACE the inherited map
    # rather than extend it, taking `.js`/`.css`/`.png` down with it.
    #
    # This is a regex location, so it wins over the `/assets/` prefix match
    # above and has to restate the caching headers those files still want.
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
