# Which app a page installs as. The manifest has to be in the HTML the
# browser first receives — some browsers never notice the one the page
# swaps in later, and then see /rooms or /app/<file>/ as Promptly itself.
# Keep in step with ``manifestFor`` in src/sw.ts (which does the same for
# pages the installed app's service worker serves).
map $request_uri $pwa_manifest {
    default                                   /manifest.webmanifest;
    ~^/rooms(?:[/?#]|$)                       /rooms.webmanifest;
    ~^/calendar(?:[/?#]|$)                    /calendar.webmanifest;
    ~^/maps(?:[/?#]|$)                        /maps.webmanifest;
    ~^/mail(?:[/?#]|$)                        /mail.webmanifest;
    ~^/photos(?:[/?#]|$)                      /photos.webmanifest;
    "~^/app/(?<pwa_app>[0-9a-fA-F-]{36})"     /api/items/app-manifest/$pwa_app.webmanifest;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip is configured in the main nginx container; keep this server simple.

    # The service worker's scope is the directory it's served from. We
    # ship sw.js at the root and want it controlling the whole origin,
    # so make sure it's served fresh — never cache the SW itself, or
    # users get stuck on stale builds even after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    # PWA manifest: nginx's stock mime.types doesn't know about
    # .webmanifest. Override the default_type just inside this
    # location so the inherited mappings (`.js`, `.css`, `.png`, …)
    # stay intact for every other request.
    # Polled by open tabs to notice an update; must never be cached.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # The other installable apps' manifests (Promptly Photos; the retired
    # Promptly Files one is kept for existing installs) — same treatment.
    location ~ ^/(photos|files|rooms|calendar|maps)\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Passwords is its own page, not a route in the main app (see the headers
    # in nginx/nginx.conf). Never cached, for the same reason as index.html.
    location ~ ^/passwords(/|$|\.html$) {
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files /passwords.html =404;
    }

    location = /passwords.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA fallback — every unmatched route returns index.html so React Router
    # can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell. index.html embeds the hashed chunk filenames
    # for the current build, so a stale copy after a redeploy makes the page
    # request chunks that no longer exist (404 → "Failed to fetch dynamically
    # imported module"). try_files' fallback to /index.html re-enters location
    # matching, so this also covers every SPA route. The hashed assets under
    # /assets/ stay immutable-cached below.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        # Point the page at its own app's manifest (see the map above).
        sub_filter '<link rel="manifest" href="/manifest.webmanifest">' '<link rel="manifest" href="$pwa_manifest">';
        sub_filter_once on;
    }

    # The PromptlySync app and its version file: same names every release,
    # so never cached — a phone checking for an update must see the new one.
    location /downloads/ {
        add_header Cache-Control "no-cache";
        # Stock mime.types has no .apk; with this type Android offers to install it.
        location ~ \.apk$ {
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "no-cache";
        }
        # The signed Firefox add-on: with this type, a click offers to install it.
        location ~ \.xpi$ {
            types { }
            default_type application/x-xpinstall;
            add_header Cache-Control "no-cache";
        }
    }

    # Long-cache hashed static assets produced by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's stock mime.types maps `.js` but not `.mjs`, so a module
    # emitted with that extension — pdf.js ships its worker as
    # `pdf.worker.min-<hash>.mjs` — was served as the default
    # `application/octet-stream`. Browsers enforce strict MIME checking on
    # ES modules and refuse to execute one that isn't a JavaScript type,
    # which surfaces as "Failed to fetch dynamically imported module": a
    # misleading message, since the fetch itself returns 200.
    #
    # Same class of gap as the `.webmanifest` override above, and handled
    # the same way — a `types` block here would REPLACE the inherited map
    # rather than extend it, taking `.js`/`.css`/`.png` down with it.
    #
    # This is a regex location, so it wins over the `/assets/` prefix match
    # above and has to restate the caching headers those files still want.
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
