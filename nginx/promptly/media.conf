# Signed media links (WP-7.5), resumable uploads (WP-8.2) and WebDAV (WP-8.4) — included
# inside the server block of nginx.conf. If you run your own server block in
# nginx/local/ (TLS), add
#     include /etc/nginx/promptly/media.conf;
# to it as well, or photos, videos, downloads, big uploads and WebDAV won't work
# there.

# Big uploads go to tusd in ~50 MB chunks (WP-8.2): streamed straight
# through (no buffering, no 100 MB body cap — tusd and the backend check
# the size), with time to write each chunk.
location ^~ /api/files/tus/ {
    limit_req  zone=api_rl burst=60 nodelay;
    limit_conn api_conn 200;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    set $tusd_backend  tusd;
    proxy_pass         http://$tusd_backend:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   CF-Connecting-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # tusd builds each upload's address from these: keep https when a
    # proxy in front (Cloudflare) terminated TLS, and the port.
    proxy_set_header   X-Forwarded-Proto $promptly_forwarded_proto;
    proxy_set_header   X-Forwarded-Host  $http_host;
    proxy_set_header   Connection        "";
}

# WebDAV for sync clients and mounts (WP-8.4): PUT bodies stream straight
# through (no buffering, no 100 MB cap — the backend checks the size), with
# time for big files; a download is answered with X-Accel-Redirect to
# /_blobs/ below. Its own rate bucket: a sync is a request per file.
location ~ ^/dav(/|$) {
    limit_req  zone=media_rl burst=600 nodelay;
    limit_conn api_conn 200;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    set $api_backend   backend;
    proxy_pass         http://$api_backend:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   CF-Connecting-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $promptly_forwarded_proto;
    proxy_set_header   Connection        "";
    proxy_set_header   X-Promptly-Accel  "1";
    # The range is for the file nginx serves, not for the backend's check.
    proxy_set_header   Range             "";
    proxy_set_header   If-Range          "";
}

# /m/<token>: the backend checks the link and that whoever it was issued to
# may still read the file, then answers with X-Accel-Redirect to /_blobs/
# below, and nginx serves the bytes itself — Range/206 for seeking,
# sendfile, nothing through the single uvicorn worker. Its own rate
# bucket: a photo grid is hundreds of small fetches at once.
location ^~ /m/ {
    limit_req  zone=media_rl burst=600 nodelay;
    limit_conn api_conn 200;

    # ``set`` before ``rewrite ... break`` (break stops the rewrite module).
    set $api_backend   backend;
    rewrite ^/m/(.*)$ /api/m/$1 break;
    proxy_pass         http://$api_backend:8000$uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   CF-Connecting-IP  $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    # Tells the backend nginx will serve the file (else it streams it).
    proxy_set_header   X-Promptly-Accel  "1";
    # The range is for the file nginx serves, not for the backend's check.
    proxy_set_header   Range             "";
    proxy_set_header   If-Range          "";
}

# Where X-Accel-Redirect lands, from the uploads folder mounted read-only.
# ``internal`` — a client asking for these paths directly gets a 404. The
# backend's Content-Type, Content-Disposition and Cache-Control are kept;
# nginx never guesses a type from a name.
#
# Originals: always a download, never a page on this origin — the same
# headers as /api/files/{id}/download. (An ``add_header`` here replaces the
# server's set, so the security headers are repeated.)
location ^~ /_blobs/ {
    internal;
    alias /srv/promptly-uploads/;
    types { }
    default_type application/octet-stream;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# The media worker's renditions (WebP tiles and previews, posters, MP4s).
location ^~ /_renditions/ {
    internal;
    alias /srv/promptly-uploads/derived/;
    types { }
    default_type application/octet-stream;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
}
