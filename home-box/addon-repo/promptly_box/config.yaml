# The Promptly Home box connector as a Home Assistant add-on ("app").
# It talks to Home Assistant through the Supervisor (no account, no token to
# manage) and dials out to the Promptly server named in the setup string.
name: Promptly Home
version: "0.1.0"
slug: promptly_box
description: Connects this box to your Promptly server, so your home's devices show in Promptly.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Core's API and WebSocket through the Supervisor, with SUPERVISOR_TOKEN.
homeassistant_api: true
options:
  setup: ""
schema:
  # From Promptly: Admin → Home → Prepare a box.
  setup: password
