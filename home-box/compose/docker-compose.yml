# A Promptly Home box on any computer with Docker: a fresh Home Assistant, a
# fresh Music Assistant (for music by name) and the Promptly connector. See
# ../README.md.
#
#   1. put the setup string from Promptly (Admin -> Home -> Prepare a box)
#      into a file called .env here:   PROMPTLY_SETUP=pbox1....
#   2. docker compose up -d --build
#
# The connector sets the fresh Home Assistant up by itself; nobody has to open
# Home Assistant's own screens. A Promptly on this same computer
# (http://localhost:8091) is reached through the host, with nothing to change.
#
# On Linux, add the second file so Home Assistant can find devices on the
# home network by itself:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d --build
name: promptly-home-box

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-UTC}
    # Only this computer can open Home Assistant's own screens (you shouldn't
    # need to). Change HA_PORT if 8123 is taken.
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"

  # Music Assistant: plays a linked streaming service (Tidal) to the home's
  # speakers. Pinned: the connector sets a fresh one up through its API.
  music:
    image: ghcr.io/music-assistant/server:2.10.12
    restart: unless-stopped
    volumes:
      - music-data:/data
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=warning

  connector:
    build: ../connector
    restart: unless-stopped
    environment:
      - PROMPTLY_SETUP=${PROMPTLY_SETUP:?Put PROMPTLY_SETUP=... (from Admin -> Home -> Prepare a box) in a .env file next to this one}
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      # Music by name. Set MUSIC_URL= (empty) in .env to leave it out.
      - MUSIC_URL=${MUSIC_URL-http://music:8095}
      # Only if the box should dial somewhere other than the address in the
      # setup string.
      - PROMPTLY_SERVER=${PROMPTLY_SERVER:-}
    # "localhost" in the setup string means this computer, not the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - box-data:/data
    depends_on:
      - homeassistant

volumes:
  ha-config:
  box-data:
  music-data:
