# ============================================================
# Promptly — single-file production compose.
#
# Run the installer first (it seeds a real `.env` and brings the
# stack up in one step):
#
#   ./install.sh          (Linux/macOS)
#   .\install.ps1         (Windows)
#
# After that, this file is all you need for day-to-day operation:
#
#   docker compose up -d
#
# Works the same on Unraid (Compose Manager points at this file), a
# plain Linux server, or Docker Desktop — as long as `.env` exists
# next to it with real secrets. Compose Manager users without a shell
# to run the installer: copy `.env.example` to `.env` and fill in
# SECRET_KEY / POSTGRES_PASSWORD / SEARXNG_SECRET by hand (each has an
# `openssl rand -hex N` one-liner in the comment above it) — the
# backend refuses to boot on the placeholder values either way, with
# an error telling you exactly what to fix.
#
# The defaults are tuned for "drop in and run" — ports stay out of
# the well-known cluster so they don't collide with the Unraid web
# UI, Portainer, the *arr stack, qBittorrent etc., and all stateful
# data lives in ./data/ alongside the compose file so backups and
# inspection are trivial.
#
# Override anything via .env (see .env.example). The most
# common ones are:
#   - NGINX_HTTP_PORT / NGINX_HTTPS_PORT (default 8087 / 8488)
#   - DOMAIN
#
# `docker-compose.dev.yml` exists separately for local
# development (Vite HMR, exposed Postgres). Don't load it on
# a production / Unraid host.
# ============================================================

# Compose project name — drives the prefix on auto-generated
# resources (volumes, default network) so they read e.g.
# "promptly_*" in `docker volume ls`.
name: Promptly

# Every service rotates its logs. The json-file driver's default keeps them
# forever, and a full disk takes Postgres down with it — a data-loss event,
# not a nuisance.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    # Pinned to a release line, bumped on purpose (R-243): `update.sh` pulls
    # patch releases within it, never a surprise major/minor jump.
    image: nginx:1.31-alpine
    container_name: Promptly-Nginx
    logging: *default-logging
    # Only nginx publishes ports to the host — everything else
    # (frontend, backend, Postgres, Redis, SearXNG) stays on the
    # internal "promptly" docker network and is reached through
    # this reverse proxy. That's simpler for the user (one URL:
    # http://<host>:8087 serves UI + API) and safer (your
    # database is never exposed on the LAN).
    ports:
      - "${NGINX_HTTP_PORT:-8087}:80"
      - "${NGINX_HTTPS_PORT:-8488}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Operator server blocks (TLS, server_name…), gitignored — see the
      # include at the end of nginx.conf.
      - ./nginx/local:/etc/nginx/conf.d/local:ro
      # Signed media links (WP-7.5): nginx serves photos, videos and
      # downloads straight from the uploads folder, read-only, once the
      # backend has checked the link.
      - ./nginx/promptly:/etc/nginx/promptly:ro
      - ${PROMPTLY_UPLOADS_DIR:-./data/uploads}:/srv/promptly-uploads:ro
    depends_on:
      - frontend
      - backend
      - collab
    restart: unless-stopped
    healthcheck:
      # nginx:alpine ships wget. We hit a static path the SPA
      # serves to confirm both nginx and the upstream frontend
      # container are alive.
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=2", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - promptly

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Promptly-Frontend
    logging: *default-logging
    environment:
      - VITE_API_BASE_URL=/api
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - promptly

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Named so the arq worker runs the very same image (it has no build of
    # its own): one build per update, and the two can never drift apart.
    image: promptly-backend:local
    container_name: Promptly-Backend
    logging: *default-logging
    # Operator settings in .env (COOKIE_SECURE, RATE_LIMIT_*, LOCKOUT_*,
    # SETUP_TOKEN, …) reach the backend. Without this only the handful of
    # variables listed below did, so documented settings silently did
    # nothing (R-283). The list below still wins where both set a value.
    env_file:
      - path: .env
        required: false
    environment: &backend-env
      - DATABASE_URL=postgresql+asyncpg://promptly:${POSTGRES_PASSWORD:-promptly}@postgres:5432/promptly
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      # Backend ↔ collab shared token; empty = derived from SECRET_KEY.
      - COLLAB_INTERNAL_TOKEN=${COLLAB_INTERNAL_TOKEN:-}
      # Resumable uploads through the tusd service below (WP-8.2). The hook
      # secret is shared with tusd; empty = only a container on this
      # network can call the hooks (nginx refuses /api/internal/ anyway).
      - TUS_ENABLED=${TUS_ENABLED:-true}
      - TUS_HOOK_SECRET=${TUS_HOOK_SECRET:-}
      - SINGLE_USER_MODE=${SINGLE_USER_MODE:-false}
      - SEARXNG_URL=http://searxng:8080
      # False when the stack runs without the bundled SearXNG container
      # (install.sh --no-search / --minimal drops the "search" compose
      # profile and flips this). Gates the /api/health SearXNG probe and
      # the system search-provider provisioning.
      - SEARXNG_ENABLED=${SEARXNG_ENABLED:-true}
      # CORS allow-list and provider/search API keys are now configured
      # through the first-run wizard and Admin → Settings — not via
      # ``.env``. The legacy ``ALLOWED_ORIGINS`` / provider env vars are
      # still honoured by ``app.config`` if set, but the install scripts
      # no longer seed them. See ``app.cors_dynamic`` for the resolution
      # order ("always-allowed localhost ∪ env ALLOWED_ORIGINS ∪ DB
      # public_origins").
      # Internal-only Ollama URL — the container is reachable on
      # the ``promptly`` network at the well-known port (host port
      # mapping uses 11435 to dodge any host-side Ollama install).
      # Used by the Custom Models RAG pipeline for local embeddings
      # and, in Phase 2, for chat completions against locally-pulled
      # models.
      # Overridable so --no-ollama installs can point at an Ollama that
      # already runs on the host (e.g. http://host.docker.internal:11434).
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # Embedding model auto-pulled on Ollama first start. Small
      # (~270 MB), fast, 768-dim — plenty for knowledge-base RAG
      # without making first-run downloads painful.
      - OLLAMA_DEFAULT_EMBEDDING_MODEL=${OLLAMA_DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      # Code-interpreter sandbox (Phase 4). The backend submits
      # model-written Python here over the internal-only ``sandbox-net``
      # network. The shared secret (reusing SECRET_KEY) gates job
      # submission as defense-in-depth on top of the network boundary.
      - CODE_SANDBOX_URL=http://sandbox:8000
      - CODE_SANDBOX_SECRET=${SECRET_KEY:-}
      # Speech-to-text worker (Voice Phase 1). Internal-only faster-whisper
      # service the backend POSTs dictation clips to. STT_BACKEND=local
      # uses it; set STT_BACKEND=openai (+ an OpenAI key) to route to the
      # cloud Whisper API instead.
      - WHISPER_URL=http://whisper:8000
      - STT_BACKEND=${STT_BACKEND:-local}
      # Text-to-speech worker (Voice Phase 2). Internal-only Kokoro service
      # the backend POSTs assistant text to for read-aloud + voice mode.
      - TTS_URL=http://tts:8000
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      # Office previews + document thumbnails through the bundled
      # Gotenberg ``convert`` service (on by default).
      - CONVERT_URL=${CONVERT_URL:-http://convert:3000}
      # Wyoming bridge (Voice Phase 2) — lets Home Assistant voice
      # satellites run this instance's commands. OFF by default: the
      # Wyoming protocol has no authentication, so anything that can
      # reach the port can run the acting user's commands. To turn it
      # on, set these AND publish the port below.
      - WYOMING_ENABLED=${WYOMING_ENABLED:-false}
      - WYOMING_PORT=${WYOMING_PORT:-10700}
      - WYOMING_USER_ID=${WYOMING_USER_ID:-}
    # Uncomment to let Home Assistant reach the Wyoming bridge. Left
    # commented so enabling voice satellites is a deliberate act rather
    # than a port that quietly appears on your network — see
    # WYOMING_ENABLED above.
    # ports:
    #   - "${WYOMING_PORT:-10700}:10700"
    volumes:
      # Bind-mount user data into the project directory so it's
      # always next to the compose file — easy to back up, easy
      # to inspect, and survives container recreation.
      # PROMPTLY_UPLOADS_DIR (WP-7.1): keep uploads somewhere else — an
      # array or NAS share — while Postgres stays on fast disk.
      - ${PROMPTLY_UPLOADS_DIR:-./data/uploads}:/app/uploads
      - ./data/whiteboard:/app/whiteboard
      # Database dumps: before every migration, and nightly (keep 14).
      - ./data/backups:/app/backups
      # Off-site backup "folder" target — point OFFSITE_BACKUP_DIR at a
      # USB disk or NAS mount on the host (Admin → Backups, WP-2.3).
      - ${OFFSITE_BACKUP_DIR:-./data/offsite}:/app/offsite
    expose:
      - "8000"
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Soft dependency — the chat path still boots and degrades
      # gracefully (code_interpreter returns a friendly error) if the
      # sandbox is slow to come up.
      sandbox:
        condition: service_started
      # Ollama is a soft dependency — the backend boots even if
      # Ollama is still warming up its embedding model (the RAG
      # ingester will surface a friendly "indexing failed, retry"
      # state in the UI rather than crashing the whole chat path).
      # ``service_started`` is enough; we don't wait on a healthcheck
      # because the model pull can take a minute on a cold install.
      # ``required: false`` (compose >= 2.20) lets the backend start
      # when the "ollama" profile is inactive (--no-ollama installs).
      ollama:
        condition: service_started
        required: false
      # Soft dependency — dictation degrades to a friendly "transcription
      # unavailable" error if Whisper is still loading its model, rather
      # than blocking the whole backend boot on the weight download.
      whisper:
        condition: service_started
      # Soft dependency — read-aloud / voice mode degrade gracefully if
      # TTS is still warming up its model.
      tts:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # Liveness only (process + Postgres). The deep /api/health probe
      # also fails on optional services like SearXNG, which used to hold
      # up everything that waits for a healthy backend. Long
      # start_period because Alembic migrations (and the pre-migration
      # backup) run on boot.
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      # Backend straddles both networks: ``promptly`` for the app
      # services (Postgres, Redis, Ollama, SearXNG) + the internet,
      # and ``sandbox-net`` so it can reach the isolated code sandbox
      # (and ``convert-net`` for the optional Office converter).
      - promptly
      - sandbox-net
      - convert-net
    extra_hosts:
      # Lets the backend reach a *native* host Ollama via
      # ``OLLAMA_URL=http://host.docker.internal:11434`` (the default when
      # install.sh detects one and doesn't bundle a container). Docker
      # Desktop provides this alias automatically; ``host-gateway`` makes it
      # work on Linux/Unraid too. Harmless when a bundled Ollama is used.
      - "host.docker.internal:host-gateway"

  arq-worker:
    # Durable execution of scheduled-automation runs. Same image as the
    # backend, launched as an Arq worker (``arq …WorkerSettings``) instead of
    # the API — so an API redeploy never kills an in-flight run: the job waits
    # in Redis and this worker picks it up. Reuses the backend's environment
    # (DB, Redis, provider/search/ollama URLs) and data volumes (runs write
    # generated files just like the API path).
    # The backend's image — built once by the backend service. Used to be a
    # second build of the same Dockerfile that had to be remembered on every
    # backend change, or the worker ran stale code (R-243).
    image: promptly-backend:local
    pull_policy: never
    container_name: Promptly-ArqWorker
    logging: *default-logging
    # Bypass the shared entrypoint (which runs Alembic migrations + singleton
    # provisioning) — the backend owns those. The worker just needs a migrated
    # DB, which is ready by the time any job is enqueued. Avoids two containers
    # racing to migrate on a fresh deploy.
    entrypoint: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    mem_limit: ${ARQ_MEM_LIMIT:-2g}
    volumes:
      - ${PROMPTLY_UPLOADS_DIR:-./data/uploads}:/app/uploads
      - ./data/whiteboard:/app/whiteboard
      - ./data/backups:/app/backups
      - ${OFFSITE_BACKUP_DIR:-./data/offsite}:/app/offsite
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend runs the migrations; new worker code must not touch
      # the database before they've landed (R-244). The worker also
      # checks the schema revision itself on startup.
      backend:
        condition: service_healthy
      ollama:
        condition: service_started
        required: false
    # Give in-flight jobs time to finish on `docker compose up -d` /
    # stop instead of being killed mid-step (R-240, R-241).
    stop_grace_period: 120s
    healthcheck:
      # arq writes a health key to Redis every few seconds while it runs.
      test: ["CMD", "arq", "--check", "app.tasks.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - promptly
      - sandbox-net
      - convert-net
    extra_hosts:
      # Same host-Ollama reachability as the backend (the worker runs
      # research/automation jobs that may hit Ollama too).
      - "host.docker.internal:host-gateway"

  collab:
    # Hocuspocus websocket collaboration server for Drive documents.
    # Terminates Y.js sync websockets on port 1234 (internal only —
    # nginx proxies /api/collab/* here) and persists document CRDT
    # state to the shared Postgres instance. Debounces a snapshot POST
    # back to the FastAPI backend so the file's HTML blob + FTS index
    # stays within ~3s of the live CRDT.
    build:
      context: ./collab
      dockerfile: Dockerfile
    container_name: Promptly-Collab
    logging: *default-logging
    mem_limit: ${COLLAB_MEM_LIMIT:-1g}
    environment:
      # SECRET_KEY verifies the short-lived collab JWT the backend hands
      # the browser (HS256). The snapshot POST back to the backend and the
      # backend's "drop this user's sockets" call use COLLAB_INTERNAL_TOKEN
      # (empty = derived from SECRET_KEY, the same on both sides).
      - SECRET_KEY=${SECRET_KEY:-}
      - COLLAB_INTERNAL_TOKEN=${COLLAB_INTERNAL_TOKEN:-}
      - DATABASE_URL=postgresql://promptly:${POSTGRES_PASSWORD:-promptly}@postgres:5432/promptly
      - BACKEND_INTERNAL_URL=http://backend:8000
      - SNAPSHOT_DEBOUNCE_MS=${COLLAB_SNAPSHOT_DEBOUNCE_MS:-3000}
    expose:
      - "1234"
    healthcheck:
      # Hocuspocus answers plain HTTP on its websocket port.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1234/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - promptly

  postgres:
    # ``pgvector/pgvector:pg15`` is the official pgvector-on-Postgres
    # image, drop-in compatible with the previous ``postgres:15-alpine``
    # data files (same major version). The ``vector`` extension is
    # enabled by an Alembic migration on first boot — the image just
    # ships the shared library so ``CREATE EXTENSION vector`` succeeds.
    # Required by Custom Models' RAG knowledge base.
    image: pgvector/pgvector:pg15
    container_name: Promptly-Postgres
    logging: *default-logging
    # Memory ceiling (DoS backstop) — well above steady-state so a query
    # spike can't OOM the host, sized for a homelab. Tune via env if needed.
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}
    environment:
      - POSTGRES_USER=promptly
      # Internal-only DB (no host port published). Defaults to ``promptly`` so
      # ``docker compose up`` works with no .env; the boot guard refuses this
      # default once DOMAIN is public, and ./install.sh seeds a strong value.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-promptly}
      - POSTGRES_DB=promptly
      # Page checksums catch a disk that silently corrupts data (WP-7.2).
      # Only applies when the database is first created — an existing one
      # is switched on offline (README → "Database checksums").
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptly -d promptly"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - promptly

  redis:
    image: redis:7.4-alpine
    container_name: Promptly-Redis
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - promptly

  ollama:
    # Local LLM runtime. Phase 1 uses it strictly for embeddings
    # (so the Custom Models RAG knowledge base works offline, even
    # without an OpenAI key); Phase 2 unlocks chat completions
    # against any model the admin pulls via the Local Models tab.
    #
    # The host port is deliberately 11435 (default Ollama port +1)
    # so a host-side Ollama install — which a lot of devs run for
    # other tooling — can keep using 11434 without colliding. The
    # backend talks to it on the internal ``promptly`` network at
    # the unmapped 11434, which is unaffected.
    image: ollama/ollama:0.40.0
    container_name: Promptly-Ollama
    logging: *default-logging
    # Optional: only runs when the "ollama" profile is active.
    # ``COMPOSE_PROFILES`` in .env is the source of truth — install.sh
    # writes ``ollama,search`` for a full install and drops entries for
    # ``--no-ollama`` / ``--no-search`` / ``--minimal``.
    profiles: ["ollama"]
    # ``OLLAMA_HOST`` defaults to 127.0.0.1 inside the container,
    # which means the docker network can't reach the API. Bind to
    # all interfaces so the backend can hit it. ``OLLAMA_KEEP_ALIVE``
    # holds models in memory between requests — at the embed-only
    # scale of Phase 1 a long keep-alive is essentially free and
    # eliminates 1-2s warm-up on every PATCH that re-indexes.
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Context window per request. Ollama's own default is small and long
      # prompts were cut off silently; raise it if you have the memory
      # (R-303). The backend reads the same value for the context meter.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # Model auto-pulled by ``entrypoint-bootstrap.sh`` on first
      # start. Mirrored from the backend env so a single env var
      # controls both sides.
      - OLLAMA_DEFAULT_EMBEDDING_MODEL=${OLLAMA_DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      # Serve more than one request at a time. Without this Ollama
      # serialises requests to a model, so a bulk background re-index
      # monopolises the embedder and an interactive workspace chat —
      # which embeds its query here for RAG retrieval before calling
      # the (possibly cloud) chat model — queues behind it and appears
      # to hang. With 2+ lanes the tiny query embed runs alongside the
      # index batch and returns immediately.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    ports:
      # SECURITY: bind the published Ollama port to LOOPBACK only. Ollama
      # has no authentication, so exposing it on 0.0.0.0 would hand the
      # whole model API (pull/delete/inference) to anyone who can reach the
      # host — a serious risk on a public domain. The backend never uses
      # this mapping; it reaches Ollama over the internal docker network on
      # the unmapped 11434. This mapping exists only so the *operator* can
      # run the `ollama` CLI locally against the container. Override
      # OLLAMA_BIND_ADDR=0.0.0.0 only on a trusted LAN behind a firewall.
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      # Bootstrap script auto-pulls the embedding model on first
      # start so the user gets working RAG out of the box without
      # `docker exec ollama ollama pull ...`. Kept tiny on purpose;
      # heavier chat models are pulled via the Local Models UI in
      # Phase 2, with a real progress bar.
      - ./scripts/ollama-bootstrap.sh:/usr/local/bin/ollama-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-bootstrap.sh"]
    # Generous, env-overridable memory ceiling so a large pulled model
    # can't OOM the whole host. Bump OLLAMA_MEM_LIMIT for big (30B+) models.
    mem_limit: ${OLLAMA_MEM_LIMIT:-16g}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - promptly

  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # Media worker (WP-7.4): photos' and videos' metadata, thumbnails,
  # previews, posters and web-playable videos, on its own Arq queue
  # (``promptly:media``) and its own CPU budget, so a phone backup of
  # hundreds of photos never slows chat. Same image as the backend.
  # GPU video encoding is opt-in: docker-compose.media-nvidia.yml /
  # docker-compose.media-vaapi.yml / docker-compose.media-qsv.yml.
  # ------------------------------------------------------------
  media-worker:
    image: promptly-backend:local
    pull_policy: never
    container_name: Promptly-MediaWorker
    logging: *default-logging
    entrypoint: ["arq", "app.tasks.media_worker.MediaWorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    # Two photos at a time, one video; capped so the rest of the box —
    # the API above all — keeps its share.
    cpus: ${MEDIA_WORKER_CPUS:-2}
    mem_limit: ${MEDIA_WORKER_MEM_LIMIT:-3g}
    volumes:
      - ${PROMPTLY_UPLOADS_DIR:-./data/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - promptly

  # ------------------------------------------------------------
  # Resumable uploads (WP-8.2): tusd takes big files (a 4 GB phone video)
  # in ~50 MB chunks it can resume after a dropped connection or a refresh,
  # writing into uploads/.tus. Before the first byte and after the last it
  # asks the backend (who, where, allowlist, disk, quota; then files it
  # through the normal upload path). Small files don't come here.
  # The whole command is set on purpose: the image's default turns on file
  # hooks, which would win over the HTTP ones.
  # ------------------------------------------------------------
  tusd:
    image: tusproject/tusd:v2.10.1
    container_name: Promptly-Tusd
    logging: *default-logging
    # Root, so it can write into the uploads folder whoever owns it (the
    # backend runs as root too); it's only reachable through nginx.
    user: "0:0"
    command:
      - -host=0.0.0.0
      - -port=8080
      - -base-path=/api/files/tus/
      - -upload-dir=/srv/uploads/.tus
      - -behind-proxy
      - -hooks-http=http://backend:8000/api/internal/tus-hook?key=${TUS_HOOK_SECRET:-}
      # No spaces — tusd checks the list as written. No post-receive (it
      # would call the backend every second per upload).
      - -hooks-enabled-events=pre-create,pre-finish,post-finish,post-terminate
      # Filing a 4 GB video (hashing it) takes a while; and never twice.
      - -hooks-http-timeout=600s
      - -hooks-http-retry=1
      - -hooks-http-size-limit=65536
      - -disable-download
      - -disable-concatenation
      - -disable-cors
      # A hard ceiling; the admin's cap (Admin > App settings) is checked
      # by the backend before an upload starts.
      - -max-size=107374182400
      - -expose-metrics=false
      - -show-greeting=false
    volumes:
      - ${PROMPTLY_UPLOADS_DIR:-./data/uploads}:/srv/uploads
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - promptly

  # Optional GPU override for the Ollama runtime.
  #
  # Enabled with ``COMPOSE_PROFILES=gpu``:
  #
  #   COMPOSE_PROFILES=gpu docker compose up -d
  #
  # This brings up a second service definition (``ollama-gpu``)
  # that reserves the host's NVIDIA GPUs via the NVIDIA Container
  # Toolkit. It uses ``container_name`` + ``profiles`` so the
  # CPU-only ``ollama`` service above is skipped when the profile
  # is active; the backend still reaches it as ``ollama`` over the
  # internal network because both services share the same name
  # via a network alias.
  #
  # Requires:
  #   - NVIDIA driver on the host
  #   - NVIDIA Container Toolkit installed + configured
  #     (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html)
  #
  # AMD GPUs get the ``ollama-rocm`` variant below (profile "rocm",
  # auto-detected by install.sh via /dev/kfd). Apple Silicon can't be
  # accelerated from inside Docker at all — no Metal passthrough —
  # so install.sh wires OLLAMA_URL at a host-native Ollama instead.
  # Intel GPUs aren't supported by upstream Ollama; they run the CPU
  # service.
  # ------------------------------------------------------------
  ollama-gpu:
    profiles: ["gpu"]
    image: ollama/ollama:0.40.0
    container_name: Promptly-Ollama-GPU
    logging: *default-logging
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Context window per request. Ollama's own default is small and long
      # prompts were cut off silently; raise it if you have the memory
      # (R-303). The backend reads the same value for the context meter.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      - OLLAMA_DEFAULT_EMBEDDING_MODEL=${OLLAMA_DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      # See the CPU service above — keep interactive query embeds from
      # queuing behind a bulk background re-index.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    ports:
      # SECURITY: loopback-only by default (see the CPU ollama service).
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./scripts/ollama-bootstrap.sh:/usr/local/bin/ollama-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-bootstrap.sh"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      promptly:
        # Share an alias with the CPU service so the backend's
        # ``OLLAMA_URL=http://ollama:11434`` resolves to whichever
        # variant is up.
        aliases:
          - ollama

  ollama-rocm:
    # AMD GPU variant — Ollama's ROCm build. Auto-selected by
    # install.sh when /dev/kfd exists (Linux + amdgpu driver).
    # Same volume/env/alias contract as the other two variants, so
    # exactly one of ollama / ollama-gpu / ollama-rocm runs at a time.
    profiles: ["rocm"]
    image: ollama/ollama:0.40.0-rocm
    container_name: Promptly-Ollama-ROCm
    logging: *default-logging
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Context window per request. Ollama's own default is small and long
      # prompts were cut off silently; raise it if you have the memory
      # (R-303). The backend reads the same value for the context meter.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      - OLLAMA_DEFAULT_EMBEDDING_MODEL=${OLLAMA_DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      # Consumer Radeons often report a GFX version ROCm doesn't officially
      # list, so Ollama silently falls back to CPU. If `ollama ps` shows
      # 100% CPU on a GPU box, uncomment ONE matching line below (leaving it
      # blank/empty would itself break ROCm, which is why it's not templated):
      #   RDNA3  RX 7000        - HSA_OVERRIDE_GFX_VERSION=11.0.0
      #   RDNA2  RX 6000        - HSA_OVERRIDE_GFX_VERSION=10.3.0
      #   RDNA1  RX 5000        - HSA_OVERRIDE_GFX_VERSION=10.1.0
      #   Vega / Radeon VII     - HSA_OVERRIDE_GFX_VERSION=9.0.0
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0
    devices:
      # ROCm reaches the GPU through the kernel fusion driver + DRM
      # nodes rather than a container-toolkit runtime.
      - /dev/kfd
      - /dev/dri
    ports:
      # SECURITY: loopback-only by default (see the CPU ollama service).
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
      - ./scripts/ollama-bootstrap.sh:/usr/local/bin/ollama-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-bootstrap.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      promptly:
        aliases:
          - ollama

  searxng:
    # Pinned to a specific dated build so a `docker compose
    # pull` can't silently break web search. Bump the tag
    # deliberately when you want to upgrade.
    # Tag list: https://hub.docker.com/r/searxng/searxng/tags
    image: searxng/searxng:2026.4.17-e8299a4c3
    container_name: Promptly-SearXNG
    logging: *default-logging
    # Optional: only runs when the "search" profile is active (see the
    # ollama service note — COMPOSE_PROFILES in .env drives both).
    profiles: ["search"]
    mem_limit: ${SEARXNG_MEM_LIMIT:-512m}
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      # Low-stakes internal secret (signs SearXNG's own result URLs). Defaults
      # so a no-.env `docker compose up` works; ./install.sh seeds a random one.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-searxng-localhost-default-change-for-public}
      - INSTANCE_NAME=promptly-search
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    expose:
      - "8080"
    restart: unless-stopped
    # Surfaces SearXNG's real state in `docker compose ps` and lets the
    # backend's own /api/health SearXNG probe line up with reality. On an
    # update-recreate SearXNG occasionally comes up degraded (see the
    # cap_drop note below); a visible ``unhealthy`` is far better than a
    # silently-broken "Up". ``/healthz`` is SearXNG's own liveness endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - promptly
    # NOTE: On first run, SearXNG occasionally can't write
    # /etc/searxng/uwsgi.ini with `cap_drop: ALL`. If the
    # container loops on startup, temporarily comment out the
    # `cap_drop` block, run `docker compose up -d searxng`,
    # then restore the cap-drop and recreate.

  sandbox:
    # Code-interpreter execution worker (Phase 4). Runs model-written
    # Python in a throwaway, resource-limited scratch dir. Deliberately
    # locked down:
    #   * On the internal-only ``sandbox-net`` (no internet, and no
    #     access to Postgres / Redis / Ollama, which live on ``promptly``).
    #   * Read-only root filesystem; the ONLY writable path is an
    #     in-memory tmpfs scratch. Throwaway jobs are wiped immediately;
    #     per-conversation session dirs persist there across calls (build
    #     a file, read it next call) and are reaped by idle-TTL + a count
    #     cap. Cleared on restart. No host or user data volumes mounted.
    #   * All Linux capabilities dropped, no privilege escalation, PID
    #     and memory caps. The worker process itself runs as non-root.
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: Promptly-Sandbox
    logging: *default-logging
    environment:
      - SANDBOX_SECRET=${SECRET_KEY:-}
    read_only: true
    tmpfs:
      - /sandbox/run:size=512m,uid=10001,gid=10001,mode=0700
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sandbox-net

  whisper:
    # Speech-to-text worker (Voice Phase 1). Wraps faster-whisper in a
    # tiny FastAPI service; the backend POSTs dictation clips to
    # http://whisper:8000/transcribe over the internal network. CPU/int8
    # by default so it runs on any homelab box — no GPU required.
    #
    # First start downloads the model weights (~140 MB for ``base``) into
    # ./data/whisper, so give it a generous start_period before the
    # healthcheck counts failures. Bump WHISPER_MODEL to small/medium/
    # large-v3 (and add a GPU) for higher accuracy.
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: Promptly-Whisper
    logging: *default-logging
    mem_limit: ${WHISPER_MEM_LIMIT:-2g}
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      # Persist downloaded model weights so the pull is a one-time cost.
      - ./data/whisper:/root/.cache
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long start period: the model download + load on a cold install
      # can take a couple of minutes on a slow connection.
      start_period: 180s
    networks:
      - promptly

  photos-ml:
    # Understanding photos (Part E §E4.2, PH-2): ONNX Runtime behind a
    # small FastAPI service. Started by default; if it's stopped, Photos
    # still works and search by what's in a photo waits until it runs.
    #
    # First start downloads the pinned models (~1.5 GB: SigLIP 2 image +
    # text encoders) into ./data/models, checked against their SHA-256.
    # Hardware: set PHOTOS_ML_PROVIDERS (OpenVINOExecutionProvider,
    # CUDAExecutionProvider) with a matching image; the CPU is the default.
    build:
      context: ./photos-ml
      dockerfile: Dockerfile
    container_name: Promptly-PhotosML
    logging: *default-logging
    cpus: ${PHOTOS_ML_CPUS:-2}
    mem_limit: ${PHOTOS_ML_MEM_LIMIT:-3g}
    environment:
      - PHOTOS_ML_PROVIDERS=${PHOTOS_ML_PROVIDERS:-}
      - PHOTOS_ML_THREADS=${PHOTOS_ML_THREADS:-0}  # 0 = the CPUs it's given
      - PHOTOS_ML_TEXT_VARIANT=${PHOTOS_ML_TEXT_VARIANT:-fp32}
      - PHOTOS_ML_VISION_VARIANT=${PHOTOS_ML_VISION_VARIANT:-fp32}
    volumes:
      - ./data/models:/models
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - promptly

  convert:
    # Faithful Office previews (Stage 12, Part C P10): Gotenberg (MIT,
    # LibreOffice inside, ~700 MB) turns .pptx / .ppt / .doc / .xls and
    # OpenDocument files into PDFs the preview shows, and gives Docs and
    # Office files their first-page thumbnails. Started by default (the
    # backend reaches it at CONVERT_URL); if it's stopped, those files
    # preview as a text outline.
    #
    # Only on the internal ``convert-net``: no internet, so a document
    # can't make LibreOffice fetch anything.
    image: gotenberg/gotenberg:8.37.0
    container_name: Promptly-Convert
    logging: *default-logging
    command:
      - gotenberg
      - --api-timeout=180s
      - --chromium-auto-start=false
      - --libreoffice-auto-start=true
      - --log-level=warn
    cpus: ${CONVERT_CPUS:-2}
    mem_limit: ${CONVERT_MEM_LIMIT:-2g}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - convert-net

  tts:
    # Text-to-speech worker (Voice Phase 2). Wraps Kokoro-82M in a tiny
    # FastAPI service; the backend POSTs assistant text to
    # http://tts:8000/tts over the internal network and gets back a WAV.
    # CPU/onnxruntime by default — no GPU, no torch.
    #
    # First start downloads the model weights (~330 MB) into ./data/tts,
    # so give it a generous start_period before the healthcheck counts
    # failures.
    build:
      context: ./tts
      dockerfile: Dockerfile
    container_name: Promptly-TTS
    logging: *default-logging
    mem_limit: ${TTS_MEM_LIMIT:-2g}
    environment:
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_LANG=${TTS_LANG:-en-us}
    volumes:
      # Persist downloaded model weights so the pull is a one-time cost.
      - ./data/tts:/root/.cache
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 240s
    networks:
      - promptly

networks:
  promptly:
    name: promptly
    driver: bridge
  # Internal-only network for the code sandbox. ``internal: true`` means
  # containers on it have NO route to the internet or to the host —
  # they can only talk to other members of this network. The backend
  # joins both ``promptly`` and ``sandbox-net``; the sandbox joins ONLY
  # this one, so executed code is fully air-gapped from everything
  # except the backend that submits the job.
  sandbox-net:
    name: promptly-sandbox
    driver: bridge
    internal: true
  # Internal-only, for the optional Office converter (Stage 12): the backend
  # and worker reach it; it reaches nothing.
  convert-net:
    name: promptly-convert
    driver: bridge
    internal: true
