[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# A test that hangs fails after five minutes, with every thread's stack in
# the log, and the run carries on (pytest-timeout; without the plugin these
# two lines are ignored). The suite used to stop dead a fifth of the way in.
timeout = 300
faulthandler_timeout = 240
