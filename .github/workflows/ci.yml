name: CI

# The first automated gate this repo has had. Before this, the only thing
# standing between a bad commit and a tagged release was `tsc -b` happening to
# run during a local Docker build.
#
# Deliberately kept to checks that pass today, so a red run always means a real
# regression rather than pre-existing debt:
#   - backend  : pytest (the full suite, ~1000 tests)
#   - frontend : eslint (errors only — warnings are tracked debt), then the
#                full production build, which is `tsc -b` + `vite build`.
#
# The full build matters more than a bare typecheck here: the PWA precache step
# (injectManifest) hard-fails when a large lazy chunk isn't listed in
# globIgnores, and that failure only ever shows up at bundle time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # The chat/streaming tests need a real database and Redis — that path
    # can't be meaningfully faked, which is why it had no coverage for so
    # long. Without these services the DB-backed tests *skip* rather than
    # fail (see tests/conftest.py), which would quietly give us a green run
    # that proved nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg15 # same image as docker-compose
        env:
          POSTGRES_USER: promptly
          POSTGRES_PASSWORD: promptly
          POSTGRES_DB: promptly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py derives the scratch database name from this and points
      # the whole app at it, so tests can never touch the primary DB.
      DATABASE_URL: postgresql+asyncpg://promptly:promptly@localhost:5432/promptly
      REDIS_URL: redis://localhost:6379/0
      # Turn a "Postgres wasn't there" skip into a hard failure here, so a
      # broken service container can't produce a green run.
      PROMPTLY_REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # matches backend/Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The system tools the backend image installs (backend/Dockerfile):
      # ffmpeg (video), exiftool (location stripping), Pango + fonts
      # (WeasyPrint PDFs), restic (off-site backups), and a pg_dump that
      # matches the Postgres 15 service exactly — backups refuse any other.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libimage-exiftool-perl restic \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-liberation fonts-dejavu-core fonts-noto-cjk postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -rs reports skip reasons, so a skipped test is visible in the log
      # rather than hiding inside a dot.
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -rs

      # WebDAV conformance (WP-8.4): the litmus suite against the real backend
      # on a scratch database. scripts/dav_litmus_harness.py relaxes only the
      # upload allowlist — litmus's files have no extension. basic, copymove
      # and http must pass in full; props and locks are left out because
      # custom ("dead") properties are refused by design (only the modified
      # time is kept) — every other test in them passes.
      - name: WebDAV conformance (litmus)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://promptly:promptly@localhost:5432/promptly_litmus
        run: |
          PGPASSWORD=promptly psql -h localhost -U promptly -d promptly -c "CREATE DATABASE promptly_litmus"
          python scripts/dav_litmus_harness.py > /tmp/harness.log 2>&1 &
          for i in $(seq 90); do grep -q "LITMUS_PASSWORD=" /tmp/harness.log && break; sleep 2; done
          LP=$(grep -o "LITMUS_PASSWORD=.*" /tmp/harness.log | cut -d= -f2)
          for i in $(seq 30); do curl -s -o /dev/null -X OPTIONS http://localhost:8765/dav/ && break; sleep 1; done
          docker run --rm --network host \
            -e LITMUS_URL=http://localhost:8765/dav/ -e LITMUS_USERNAME=litmus -e LITMUS_PASSWORD="$LP" \
            -e TESTS="basic copymove http" \
            owncloud/litmus@sha256:155d66b7c4324d45a2391702f7857f7e96d79e3d96a2460298b9a4c4867074b5

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22" # matches frontend/Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Fails on errors only. Warnings (currently ~233: exhaustive-deps,
      # a11y, explicit-any) are known debt — use `npm run lint:strict` when
      # burning them down.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `tsc -b` + `vite build` + PWA precache generation.
      - name: Build
        working-directory: frontend
        run: npm run build
